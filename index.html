<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020805">
  <title>GAYClient - настройки интерфейса</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #38ff7d;
      --accent-rgb: 56, 255, 125;
      --accent-deep: #0bb54b;
      --accent-pale: #caffda;
      --text: #effcf3;
      --text-soft: #c3d9c9;
      --muted: #7f9e89;
      --dim: #55715f;
      --danger: #ff6d79;
      --bg: #000000;
      --shell: #041009;
      --panel: #06160d;
      --panel-deep: #030c07;
      --line: rgba(94, 255, 151, .15);
      --line-mid: rgba(82, 255, 142, .25);
      --line-strong: rgba(72, 255, 136, .48);
      --glow: 0 0 24px rgba(var(--accent-rgb), .25);
      --font: "Manrope", "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", "Consolas", monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid rgba(var(--accent-rgb), .75);
      outline-offset: 2px;
    }
    ::selection { background: rgba(var(--accent-rgb), .28); color: #fff; }

    /* ── Сцена: чёрный кадр игры, без имитации игрового мира ───────────── */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 58% 56% at 51% 48%, rgba(7, 33, 17, .30) 0%, rgba(0, 8, 3, .18) 43%, transparent 72%),
        linear-gradient(180deg, #000 0%, #010503 52%, #000 100%);
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(53, 255, 117, .022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53, 255, 117, .022) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at center, black 5%, transparent 72%);
      pointer-events: none;
    }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .80) 100%);
      pointer-events: none;
    }
    .scene-glow {
      position: absolute;
      width: 61vw;
      height: 70vh;
      left: 18vw;
      top: 12vh;
      border-radius: 50%;
      background: rgba(15, 103, 45, .15);
      filter: blur(120px);
      pointer-events: none;
    }
    .scene-pixel {
      position: absolute;
      background: rgba(50, 255, 116, .24);
      box-shadow: 0 0 12px rgba(50, 255, 116, .28);
      pointer-events: none;
    }
    .scene-pixel.p1 { width: 16px; height: 16px; left: 12%; top: 11%; }
    .scene-pixel.p2 { width: 8px; height: 8px; left: 14%; top: 16%; opacity: .6; }
    .scene-pixel.p3 { width: 12px; height: 12px; left: 17%; top: 9%; opacity: .4; }
    .scene-pixel.p4 { width: 18px; height: 18px; right: 9%; top: 21%; opacity: .32; }
    .scene-pixel.p5 { width: 9px; height: 9px; right: 7%; top: 17%; opacity: .6; }
    .scene-pixel.p6 { width: 14px; height: 14px; right: 12%; top: 13%; opacity: .3; }
    .scene-pixel.p7 { width: 10px; height: 10px; left: 7%; bottom: 16%; opacity: .54; }
    .scene-pixel.p8 { width: 22px; height: 22px; left: 11%; bottom: 11%; opacity: .16; }
    .scene-pixel.p9 { width: 13px; height: 13px; right: 8%; bottom: 8%; opacity: .45; }
    .scene-pixel.p10 { width: 7px; height: 7px; right: 13%; bottom: 15%; opacity: .7; }
    .scene-caption {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 1;
      color: rgba(179, 211, 188, .33);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Оболочка одного окна ───────────────────────────────────────────── */
    .menu-shell {
      position: relative;
      z-index: 3;
      width: min(1560px, calc(100vw - 56px));
      height: min(870px, calc(100vh - 48px));
      min-height: 630px;
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      border-radius: 24px;
      border: 1px solid rgba(80, 255, 142, .36);
      background: linear-gradient(142deg, #07180e 0%, #030b06 42%, #06150c 100%);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .75),
        0 0 0 4px rgba(15, 50, 27, .40),
        0 30px 90px rgba(0, 0, 0, .92),
        0 0 64px rgba(39, 255, 111, .14),
        inset 0 0 60px rgba(22, 112, 51, .08);
      isolation: isolate;
    }
    .menu-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background:
        radial-gradient(ellipse 26% 40% at 0% 14%, rgba(47, 255, 117, .08), transparent 70%),
        radial-gradient(ellipse 36% 28% at 100% 0%, rgba(45, 255, 116, .06), transparent 76%),
        repeating-linear-gradient(90deg, transparent 0 79px, rgba(82, 255, 143, .017) 79px 80px);
      pointer-events: none;
    }

    /* ── Левая колонка ─────────────────────────────────────────────────── */
    .sidebar {
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px 14px 14px;
      border-right: 1px solid rgba(84, 255, 143, .13);
      border-radius: 23px 0 0 23px;
      background:
        radial-gradient(ellipse 125% 32% at 50% 0%, rgba(46, 255, 116, .10), transparent 70%),
        linear-gradient(160deg, rgba(4, 16, 9, .82), rgba(2, 8, 5, .62));
    }
    .brand-zone {
      position: relative;
      flex: 0 0 202px;
      width: 100%;
      user-select: none;
    }
    .brand-cat {
      position: absolute;
      z-index: 3;
      width: 176px;
      height: 180px;
      left: 50%;
      top: -22px;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 14px rgba(35, 255, 108, .38));
      pointer-events: none;
      animation: mascotFloat 6s ease-in-out infinite;
    }
    @keyframes mascotFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }
    .brand-card {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 0;
      padding: 13px 10px 12px;
      text-align: center;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(12, 45, 23, .96), rgba(3, 13, 7, .97));
      box-shadow:
        0 0 22px rgba(42, 255, 116, .16),
        inset 0 0 24px rgba(64, 255, 135, .055),
        inset 0 1px rgba(181, 255, 204, .16);
      overflow: hidden;
    }
    .brand-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(112deg, transparent 20%, rgba(255, 255, 255, .035) 40%, transparent 60%);
      pointer-events: none;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .brand-word {
      font-size: 21px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .035em;
      color: #f5fff7;
      text-shadow: 0 0 14px rgba(var(--accent-rgb), .44);
      white-space: nowrap;
    }
    .brand-word em { color: var(--accent); font-style: normal; }
    .brand-ver {
      flex: 0 0 auto;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid rgba(var(--accent-rgb), .25);
      background: rgba(var(--accent-rgb), .07);
      color: rgba(var(--accent-rgb), .85);
      font-family: var(--mono);
      font-size: 6.5px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .brand-sub {
      margin-top: 7px;
      color: #a2bcaa;
      font-size: 7.5px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .34em;
      white-space: nowrap;
    }
    .nav-caption {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 5px;
      margin: 12px 0 8px;
      color: #506e5b;
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .nav-caption::after { content: ""; height: 1px; flex: 1; background: rgba(93, 255, 150, .08); }
    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-height: 0;
    }
    .nav-btn {
      position: relative;
      width: 100%;
      height: 46px;
      flex: 0 0 46px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #99b3a1;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }
    .nav-btn:hover {
      color: #edfff2;
      background: rgba(var(--accent-rgb), .055);
      border-color: rgba(var(--accent-rgb), .14);
      transform: translateX(1px);
    }
    .nav-btn.is-active {
      color: #f7fff9;
      border-color: rgba(78, 255, 141, .42);
      background: linear-gradient(90deg, rgba(52, 255, 122, .20), rgba(47, 255, 117, .055));
      box-shadow: inset 0 0 22px rgba(46, 255, 113, .08), 0 0 18px rgba(43, 255, 111, .10);
    }
    .nav-btn.is-active::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 23px;
      border-radius: 0 4px 4px 0;
      left: -5px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      box-shadow: 0 0 10px rgba(var(--accent-rgb), .85);
    }
    .nav-icon {
      width: 29px;
      height: 28px;
      flex: 0 0 29px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--accent);
      background: rgba(var(--accent-rgb), .06);
      border: 1px solid rgba(var(--accent-rgb), .13);
      box-shadow: inset 0 0 12px rgba(var(--accent-rgb), .035);
      transition: background .16s ease, box-shadow .16s ease;
    }
    .nav-btn.is-active .nav-icon {
      background: rgba(var(--accent-rgb), .15);
      border-color: rgba(var(--accent-rgb), .34);
      box-shadow: 0 0 12px rgba(var(--accent-rgb), .12), inset 0 0 10px rgba(var(--accent-rgb), .09);
    }
    .nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-spacer { flex: 1 1 auto; min-height: 8px; }
    .sidebar-fill {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 12px;
      padding: 10px 11px 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), .17);
      background:
        radial-gradient(ellipse 120% 90% at 100% 0%, rgba(var(--accent-rgb), .10), transparent 68%),
        linear-gradient(160deg, rgba(8, 30, 16, .82), rgba(2, 10, 6, .86));
      box-shadow: inset 0 1px rgba(204, 255, 222, .05), inset 0 0 22px rgba(var(--accent-rgb), .022);
    }
    .sidebar-fill::before {
      content: "";
      position: absolute;
      left: 11px; right: 11px; top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .55), transparent);
      pointer-events: none;
    }
    .fill-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
    .fill-status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      margin-bottom: 8px;
      border-radius: 7px;
      border: 1px solid rgba(var(--accent-rgb), .15);
      background: rgba(var(--accent-rgb), .045);
    }
    .fill-status .online-dot { width: 6px; height: 6px; flex-basis: 6px; }
    .fill-status-copy { min-width: 0; }
    .fill-status-copy b { display: block; color: #dff8e6; font-size: 9.5px; font-weight: 700; line-height: 1.2; }
    .fill-status-copy small { display: block; margin-top: 2px; color: #6d8b79; font-size: 7px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fill-chart { position: relative; flex: 1 1 auto; min-height: 44px; max-height: 158px; margin: 8px 0 0; display: flex; flex-direction: column; }
    .fill-chart .fill-chart-svg {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), .09);
      background:
        linear-gradient(rgba(var(--accent-rgb), .045) 1px, transparent 1px) 0 0 / 100% 14px,
        rgba(2, 12, 7, .5);
    }
    .fill-chart .fill-chart-svg svg { width: 100%; height: 100%; display: block; }
    .fill-chart .fill-chart-cap {
      display: block;
      margin-top: 4px;
      color: rgba(var(--accent-rgb), .38);
      font-family: var(--mono);
      font-size: 6px;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fill-title {
      display: flex; align-items: center; gap: 6px;
      color: #a7c7b1; font-size: 8px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    }
    .fill-title::before { content: ""; width: 4px; height: 4px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .fill-badge {
      padding: 2px 5px; border-radius: 3px;
      border: 1px solid rgba(var(--accent-rgb), .22);
      background: rgba(var(--accent-rgb), .07);
      color: rgba(var(--accent-rgb), .85);
      font-family: var(--mono); font-size: 6.5px; letter-spacing: .08em;
    }
    .fill-meter { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-bottom: 8px; }
    .fill-meter i {
      flex: 1; height: 6px; border-radius: 1px;
      background: rgba(var(--accent-rgb), .12);
      transition: background .2s ease, height .2s ease, box-shadow .2s ease;
    }
    .fill-meter i:nth-child(3n) { height: 10px; }
    .fill-meter i:nth-child(4n) { height: 14px; }
    .fill-meter i:nth-child(5n) { height: 8px; }
    .fill-meter i.on {
      background: linear-gradient(180deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-rgb), .42));
      box-shadow: 0 0 6px rgba(var(--accent-rgb), .28);
    }
    .fill-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 17px; font-size: 8.5px;
    }
    .fill-row + .fill-row { border-top: 1px solid rgba(var(--accent-rgb), .055); }
    .fill-label { color: #6d8b79; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fill-value { color: #c3dfcb; font-family: var(--mono); font-size: 8px; white-space: nowrap; }
    .fill-value.mono { color: #93b5a0; }
    .fill-value.dim { color: #7d9a86; }
    .fill-pixels { position: absolute; right: 7px; top: 25px; width: 30px; height: 26px; pointer-events: none; opacity: .5; }
    .fill-pixels span {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--accent);
      box-shadow: 0 0 4px rgba(var(--accent-rgb), .35);
    }
    .fill-pixels span:nth-child(3n) { width: 2px; height: 2px; }
    .fill-pixels span:nth-child(4n) { width: 4px; height: 4px; }
    .fill-links { display: flex; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 8px; }
    .fill-link {
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid rgba(var(--accent-rgb), .12);
      background: rgba(var(--accent-rgb), .035);
      color: #93b19d;
      font-size: 9.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }
    .fill-link .ic { color: var(--accent); opacity: .8; }
    .fill-link span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fill-link:hover {
      color: #eafff0;
      border-color: rgba(var(--accent-rgb), .34);
      background: rgba(var(--accent-rgb), .09);
      transform: translateX(1px);
    }
    .fill-link:hover .ic { opacity: 1; }
    .mono { font-family: var(--mono); }
    @media (max-height: 800px) and (min-width: 901px) {
      .sidebar-fill { min-height: 0; flex: 1 1 auto; padding-top: 8px; padding-bottom: 8px; }
      .fill-links { flex-direction: row; flex-wrap: wrap; margin-top: 4px; }
      .fill-link { flex: 1 1 auto; height: 24px; padding: 0 6px; font-size: 8.5px; gap: 4px; }
      .fill-pixels, .fill-chart { display: none; }
    }
    @media (max-height: 660px) and (min-width: 901px) { .sidebar-fill { display: none; } }
    @media (max-width: 900px) { .sidebar-fill { display: none; } }
    .sidebar-status {
      flex: 0 0 auto;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(82, 255, 143, .24);
      background: linear-gradient(160deg, rgba(8, 31, 17, .88), rgba(2, 10, 6, .9));
      box-shadow: inset 0 1px rgba(204, 255, 222, .06);
      position: relative;
      overflow: hidden;
    }
    .sidebar-status::after {
      content: "";
      width: 22px; height: 22px;
      position: absolute; right: 8px; bottom: 7px;
      background:
        linear-gradient(var(--accent), var(--accent)) 0 0 / 8px 8px no-repeat,
        linear-gradient(var(--accent), var(--accent)) 12px 8px / 6px 6px no-repeat,
        linear-gradient(var(--accent), var(--accent)) 6px 15px / 5px 5px no-repeat;
      opacity: .24;
    }
    .online-dot {
      width: 8px; height: 8px; flex: 0 0 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 9px var(--accent);
      animation: dotPulse 2.4s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .status-copy { min-width: 0; }
    .status-title { color: #eafff0; font-size: 11.5px; font-weight: 700; line-height: 1.3; }
    .status-meta { color: #789381; font-size: 9.5px; line-height: 1.4; margin-top: 2px; white-space: nowrap; }
    .sidebar-mini-version {
      margin: 9px 3px 0;
      display: flex;
      justify-content: space-between;
      color: #496252;
      font-size: 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Правая рабочая область ─────────────────────────────────────────── */
    .workspace {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      flex: 0 0 58px;
      min-width: 0;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 17px;
      border-bottom: 1px solid rgba(85, 255, 145, .12);
      position: relative;
      background: linear-gradient(180deg, rgba(6, 24, 13, .42), rgba(3, 12, 7, .08));
    }
    .top-heading { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .top-mark {
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), .3);
      background: linear-gradient(145deg, rgba(var(--accent-rgb), .13), rgba(3, 14, 8, .82));
      box-shadow: inset 0 1px rgba(220, 255, 232, .09), 0 0 14px rgba(var(--accent-rgb), .08);
    }
    .top-mark .ic { width: 16px; height: 16px; }
    .top-copy { min-width: 0; }
    .top-eyebrow {
      color: #5f806c;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-title {
      margin-top: 2px;
      color: #f1fff5;
      font-size: 15px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-ornament { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 10px; padding-right: 2px; }
    .top-ornament i {
      display: block;
      height: 3px;
      border-radius: 2px;
      background: rgba(var(--accent-rgb), .30);
      box-shadow: 0 0 6px rgba(var(--accent-rgb), .12);
    }

    .top-status {

    .topbar::after {
      content: "";

      left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79, 255, 139, .18) 18%, rgba(79, 255, 139, .08) 76%, transparent);

    .top-tab.is-active {

      box-shadow: inset 0 1px rgba(207, 255, 223, .15), inset 0 0 24px rgba(65, 255, 132, .06), 0 0 22px rgba(46, 255, 113, .10);

    }
    .top-tab.is-active::after {
      content: "";

    }
    .top-tab.is-active .tab-icon { color: var(--accent); filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), .5)); }
    .window-chrome {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid rgba(84, 255, 143, .16);
      border-radius: 10px;
      background: rgba(3, 14, 8, .68);
      margin-bottom: 1px;
    }
    .chrome-btn {
      width: 27px; height: 27px;

      border: 1px solid transparent;
      background: transparent;
      color: #7d9b88;
      cursor: pointer;

    }
    .chrome-btn:hover { background: rgba(var(--accent-rgb), .11); border-color: rgba(var(--accent-rgb), .20); color: #edfff2; }
    .chrome-btn.danger:hover { background: rgba(255, 85, 103, .13); border-color: rgba(255, 109, 121, .25); color: #ff9da6; }

    .workspace-main {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, .96fr) minmax(0, 1.38fr);
      gap: 13px;
      padding: 13px 16px 9px;
    }
    .content-column {
      min-width: 0;
      min-height: 0;

        linear-gradient(180deg, rgba(7, 24, 14, .72), rgba(3, 12, 7, .62));
      box-shadow: inset 0 1px rgba(203, 255, 220, .035), inset 0 0 40px rgba(44, 255, 114, .015);

    .content-column::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb), .26); border-radius: 20px; }
    .content-column::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb), .40); }

    /* ── Заголовки и настройки ──────────────────────────────────────────── */
    .section-head {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 1px 0 11px;
    }
    .section-icon {
      width: 38px; height: 38px; flex: 0 0 38px;

      color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), .21);
      background: linear-gradient(145deg, rgba(var(--accent-rgb), .12), rgba(var(--accent-rgb), .025));
      box-shadow: inset 0 1px rgba(214, 255, 228, .07), 0 0 16px rgba(var(--accent-rgb), .06);
    }
    .section-copy { min-width: 0; flex: 1; }
    .section-title { margin: 0; color: #f4fff7; font-size: 19px; line-height: 1.16; font-weight: 800; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-subtitle { margin: 4px 0 0; color: #7f9d89; font-size: 10.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(var(--accent-rgb), .18);

    .settings-group {
      margin-top: 9px;
      border-radius: 12px;
      border: 1px solid rgba(84, 255, 143, .15);

      box-shadow: inset 0 1px rgba(198, 255, 218, .035);
      overflow: hidden;
    }
    .settings-group:first-of-type { margin-top: 0; }
    .group-header {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px 8px;
      border-bottom: 1px solid rgba(84, 255, 143, .08);
    }
    .group-title { color: #e9fff0; font-size: 12px; font-weight: 800; letter-spacing: -.01em; flex: 1 1 auto; }
    .group-mark { width: 5px; height: 5px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 7px var(--accent); flex: 0 0 5px; }
    .group-note { color: #587360; font-family: var(--mono); font-size: 7.5px; text-transform: uppercase; letter-spacing: .04em; }
    .group-body { padding: 2px 6px 5px; }
    .setting-row {
      display: flex;

    }
    .setting-row:hover { background: rgba(var(--accent-rgb), .035); }

    .row-icon {
      width: 25px; height: 25px; flex: 0 0 25px;
      display: grid; place-items: center;
      color: var(--accent);

      border: 1px solid rgba(var(--accent-rgb), .20);

    }
    .row-icon.plain { border-color: transparent; background: transparent; }
    .row-label { flex: 1 1 auto; min-width: 0; color: var(--text-soft); font-size: 11.5px; font-weight: 500; line-height: 1.3; }
    .row-note {
      display: inline-block;

    }
    .row-control { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
    .setting-row .row-control.wide { flex: 1 1 auto; }
    .muted-value { color: #6b8774; font-size: 9.5px; white-space: nowrap; }

    /* Переключатели */
    .switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex: 0 0 39px;
      width: 39px; height: 21px;
      border-radius: 999px;
      padding: 2px;
      border: 1px solid rgba(143, 164, 150, .35);
      background: #29382e;
      cursor: pointer;
      transition: background .18s, border-color .18s, box-shadow .18s;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .38);
    }
    .switch::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 24% 50%, rgba(255,255,255,.10), transparent 50%);
      pointer-events: none;
    }
    .switch-knob {
      position: relative;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #e3ece6;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
      transform: translateX(0);
      transition: transform .20s cubic-bezier(.2,.85,.25,1), background .18s, box-shadow .18s;
      z-index: 1;
    }
    .switch.is-on {
      background: linear-gradient(180deg, #45ff8c, #1bcd5d);
      border-color: rgba(117, 255, 164, .85);
      box-shadow: 0 0 13px rgba(var(--accent-rgb), .26), inset 0 1px rgba(234, 255, 242, .33);
    }
    .switch.is-on .switch-knob {
      transform: translateX(18px);
      background: #fff;
      box-shadow: 0 0 6px rgba(255, 255, 255, .70);
    }
    .switch:hover { border-color: rgba(var(--accent-rgb), .58); }
    .switch.is-on:hover { box-shadow: 0 0 17px rgba(var(--accent-rgb), .38), inset 0 1px rgba(234, 255, 242, .4); }
    .switch.small { width: 34px; flex-basis: 34px; height: 19px; }
    .switch.small .switch-knob { width: 13px; height: 13px; }
    .switch.small.is-on .switch-knob { transform: translateX(15px); }

    /* Ползунки */
    .range-wrap { display: flex; align-items: center; gap: 8px; min-width: 176px; max-width: 217px; width: 100%; }
    .range {
      --p: 50%;
      -webkit-appearance: none;
      appearance: none;
      display: block;
      flex: 1 1 auto;
      min-width: 80px;
      height: 16px;
      margin: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .range::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) 0 var(--p), rgba(139, 166, 147, .20) var(--p) 100%);
      box-shadow: 0 0 7px rgba(var(--accent-rgb), .11);
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px; height: 13px;
      margin-top: -4.5px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: #f2fff5;
      box-shadow: 0 0 9px rgba(var(--accent-rgb), .65), 0 1px 3px rgba(0,0,0,.4);
      transition: transform .13s ease, box-shadow .13s ease;
    }
    .range:hover::-webkit-slider-thumb { transform: scale(1.12); box-shadow: 0 0 14px rgba(var(--accent-rgb), .9); }
    .range::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(139, 166, 147, .20); }
    .range::-moz-range-progress { height: 4px; border-radius: 99px; background: var(--accent); }
    .range::-moz-range-thumb { width: 11px; height: 11px; border: 3px solid var(--accent); border-radius: 50%; background: #f2fff5; box-shadow: 0 0 9px rgba(var(--accent-rgb), .65); }
    .range-val { flex: 0 0 41px; min-width: 41px; text-align: right; color: #d3e8d9; font-family: var(--mono); font-size: 9.5px; white-space: nowrap; }
    .range-wrap.compact { min-width: 145px; }
    .range-wrap.compact .range-val { flex-basis: 34px; min-width: 34px; }

    /* Списки и поля */
    .select-shell { position: relative; min-width: 152px; max-width: 208px; }
    .select-shell::after {
      content: "";
      position: absolute;
      right: 11px; top: 50%;
      width: 6px; height: 6px;
      border-right: 1.6px solid var(--accent);
      border-bottom: 1.6px solid var(--accent);
      transform: translateY(-68%) rotate(45deg);
      pointer-events: none;
    }
    .select-shell select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      height: 31px;
      border-radius: 8px;
      border: 1px solid rgba(100, 255, 153, .26);
      background: #071d10;
      color: #dff7e7;
      font-size: 10.5px;
      font-weight: 600;
      padding: 0 29px 0 10px;
      cursor: pointer;
      box-shadow: inset 0 1px rgba(210, 255, 225, .05);
      text-overflow: ellipsis;
    }
    .select-shell select:hover { border-color: rgba(100, 255, 153, .45); }
    .select-shell select option { background: #06170d; color: #edfff3; }
    .color-control {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 31px;
      border: 1px solid rgba(99, 255, 152, .23);
      background: #06190f;
      border-radius: 8px;
      padding: 0 8px 0 4px;
      cursor: pointer;
    }
    .color-control:hover { border-color: rgba(99, 255, 152, .5); }
    .color-control input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      width: 23px; height: 23px;
      padding: 0; border: none; border-radius: 5px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
    }
    .color-control input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-control input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    .color-control input[type="color"]::-moz-color-swatch { border: none; border-radius: 5px; }
    .color-hex { color: #aec8b7; font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: .02em; }
    .text-input {
      width: 100%;
      min-width: 0;
      height: 37px;
      border: 1px solid rgba(92, 255, 146, .20);
      border-radius: 9px;
      background: rgba(2, 12, 7, .75);
      color: #eafff0;
      padding: 0 12px 0 34px;
      font-size: 11.5px;
      transition: border-color .15s, box-shadow .15s;
    }
    .text-input::placeholder { color: #58715f; }
    .text-input:focus { outline: none; border-color: rgba(var(--accent-rgb), .6); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .08); }
    .search-wrap { position: relative; }
    .search-wrap .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #648471; pointer-events: none; display: inline-flex; }
    .search-wrap:focus-within .search-icon { color: var(--accent); }

    /* Кнопки */
    .action-row { display: flex; gap: 7px; flex-wrap: wrap; padding-top: 9px; }
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid rgba(98, 255, 151, .23);
      background: linear-gradient(180deg, rgba(13, 39, 22, .78), rgba(4, 17, 9, .82));
      color: #ccdfd2;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: .16s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover {
      color: #f5fff8;
      border-color: rgba(var(--accent-rgb), .54);
      background: linear-gradient(180deg, rgba(22, 59, 34, .88), rgba(6, 24, 13, .92));
      box-shadow: 0 0 16px rgba(var(--accent-rgb), .10);
    }
    .btn.primary {
      color: #f5fff8;
      border-color: rgba(var(--accent-rgb), .53);
      background: linear-gradient(180deg, rgba(37, 103, 56, .75), rgba(6, 37, 18, .90));
      box-shadow: inset 0 1px rgba(209, 255, 224, .12), 0 0 15px rgba(var(--accent-rgb), .09);
    }
    .btn.primary:hover { box-shadow: inset 0 1px rgba(209, 255, 224, .17), 0 0 21px rgba(var(--accent-rgb), .20); }
    .btn.ghost { background: transparent; border-color: rgba(99, 255, 151, .11); color: #799781; }
    .btn.danger { color: #ffadb5; border-color: rgba(255, 107, 123, .27); background: rgba(70, 14, 21, .22); }
    .btn.danger:hover { border-color: rgba(255, 107, 123, .58); box-shadow: 0 0 16px rgba(255, 85, 104, .11); color: #ffd2d6; }
    .btn.grow { flex: 1 1 auto; }
    .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .btn.tiny { min-height: 29px; padding: 0 10px; font-size: 9px; }
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 30px; height: 30px;
      border: 1px solid rgba(106, 255, 157, .16);
      border-radius: 7px;
      background: rgba(7, 24, 14, .6);
      color: #8eae99;
      cursor: pointer;
      transition: .15s;
    }
    .icon-btn:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), .4); background: rgba(var(--accent-rgb), .07); }

    /* Мини-виджеты */
    .home-hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 9px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(84, 255, 144, .24);
      background:
        radial-gradient(ellipse 80% 130% at 100% 0%, rgba(var(--accent-rgb), .13), transparent 62%),
        linear-gradient(150deg, rgba(11, 38, 21, .82), rgba(3, 15, 8, .92));
      box-shadow: inset 0 1px rgba(212, 255, 227, .06);
    }
    .home-hero::after {
      content: "";
      position: absolute; width: 76px; height: 76px; right: 2px; top: -15px;
      background-image:
        linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent)),
        linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--accent), var(--accent));
      background-size: 9px 9px, 5px 5px, 4px 4px, 7px 7px;
      background-position: 0 0, 12px 8px, 7px 17px, 47px 45px;
      background-repeat: no-repeat;
      opacity: .14;
      pointer-events: none;
    }
    .hero-eyebrow { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 8px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .hero-title { margin: 7px 0 4px; font-size: 25px; font-weight: 800; line-height: 1; letter-spacing: -.035em; color: #f5fff8; }
    .hero-desc { margin: 0; max-width: 310px; color: #8daa96; font-size: 10.5px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      min-height: 21px;
      padding: 3px 7px;
      border-radius: 5px;
      color: #a7c4af;
      font-size: 8.5px;
      font-weight: 600;
      line-height: 1.15;
      border: 1px solid rgba(99, 255, 152, .17);
      background: rgba(8, 28, 16, .65);
    }
    .pill.green { color: #d6ffdf; background: rgba(var(--accent-rgb), .09); border-color: rgba(var(--accent-rgb), .25); }
    .pill.demo { color: #a9c8b2; border-style: dashed; }
    .pill.warn { color: #f1d191; border-color: rgba(240, 202, 103, .25); background: rgba(75, 58, 16, .18); }
    .mini-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
    .quick-card {
      display: flex; align-items: center; gap: 8px; min-height: 36px;
      padding: 6px 8px; border-radius: 8px;
      border: 1px solid rgba(91, 255, 146, .12);
      background: rgba(6, 22, 12, .55);
      color: #b9d3c0; font-size: 9.5px; font-weight: 600; cursor: pointer;
      text-align: left; transition: .15s;
    }
    .quick-card:hover { color: #f2fff5; border-color: rgba(var(--accent-rgb), .35); background: rgba(var(--accent-rgb), .065); }
    .quick-card .ic { color: var(--accent); }
    .value-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .metric-mini {
      border: 1px solid rgba(92, 255, 146, .10);
      border-radius: 8px;
      background: rgba(3, 14, 8, .58);
      padding: 8px;
    }
    .metric-mini .label { color: #73907e; font-size: 8px; letter-spacing: .02em; }
    .metric-mini .value { color: #e1f8e7; font-family: var(--mono); font-size: 12px; font-weight: 600; margin-top: 3px; }
    .metric-mini .value.dim { color: #657c6b; }

    /* Позиции HUD */
    .position-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px 5px 5px; }
    .position-tile {
      height: 27px; border-radius: 6px;
      border: 1px solid rgba(90, 255, 145, .12);
      background: rgba(4, 17, 9, .55);
      color: #5e7a67; cursor: pointer;
      display: grid; place-items: center; transition: .14s;

    /* ── Адаптивность ───────────────────────────────────────────────────── */

<body>
  <div class="scene">

    <main class="menu-shell" id="menuShell" aria-label="Меню GAYClient">

  <div class="modal-layer" id="modalLayer" role="presentation">

  </div>

  <script>
    "use strict";

    /* ───────────────────────────────────────────────────────────────────────
       СОСТОЯНИЕ
       Всё визуальное состояние находится здесь. Подключение к игровому
       клиенту сводится к записи значений в state и рендеру через render().
       Значения по умолчанию — только демонстрационные.
    ─────────────────────────────────────────────────────────────────────── */

    const DEFAULT_POSITIONS = ["Сверху слева", "Сверху справа", "Снизу слева", "Снизу справа", "Собственная позиция"];
    const DEFAULT_MODULES = [
      {
        id: "fps", name: "FPS", category: "HUD", icon: "activity", enabledPath: "hud.fps",
        desc: "Счётчик кадров в игровом HUD",
        fields: [
          { type: "select", label: "Положение", path: "hud.position", options: DEFAULT_POSITIONS },
          { type: "range", label: "Масштаб", path: "hud.hudScale", min: 0.5, max: 2, step: 0.05, suffix: "x", decimals: 2 },
          { type: "range", label: "Прозрачность", path: "hud.opacity", min: 0, max: 100, step: 1, suffix: "%" },
          { type: "color", label: "Цвет текста", path: "hud.textColor" }
        ]
      },
      {
        id: "cps", name: "CPS", category: "HUD", icon: "mouse-pointer-click", enabledPath: "hud.cps",
        desc: "Счётчик кликов и нажатий в секунду",
        fields: [
          { type: "range", label: "Ширина карточки", path: "hud.hudSize", min: 0.6, max: 1.6, step: 0.05, suffix: "x", decimals: 2 },
          { type: "range", label: "Прозрачность", path: "hud.opacity", min: 0, max: 100, step: 1, suffix: "%" },
          { type: "color", label: "Цвет текста", path: "hud.textColor" },
          { type: "select", label: "Положение", path: "hud.position", options: DEFAULT_POSITIONS }
        ]
      },
      {
        id: "clock", name: "Clock", category: "HUD", icon: "clock", enabledPath: "hud.clock",
        desc: "Часы в выбранном формате",
        fields: [
          { type: "toggle", label: "Показывать секунды", path: "hud.clockSeconds" },
          { type: "select", label: "Формат", path: "hud.clockFormat", options: ["24 часа", "12 часов"] },
          { type: "color", label: "Цвет текста", path: "hud.textColor" }
        ]
      },
      {
        id: "keystrokes", name: "Keystrokes", category: "HUD", icon: "keyboard", enabledPath: "hud.keystrokes",
        desc: "Отображение нажатых клавиш",
        fields: [
          { type: "range", label: "Масштаб", path: "hud.hudScale", min: 0.5, max: 2, step: 0.05, suffix: "x", decimals: 2 },
          { type: "range", label: "Прозрачность", path: "hud.opacity", min: 0, max: 100, step: 1, suffix: "%" },
          { type: "range", label: "Скругление", path: "hud.radius", min: 0, max: 20, step: 1, suffix: "px" }
        ]
      },
      {
        id: "watermark", name: "Watermark", category: "HUD", icon: "droplet", enabledPath: "hud.watermark",
        desc: "Водяной знак клиента",
        fields: [
          { type: "select", label: "Положение", path: "hud.position", options: DEFAULT_POSITIONS },
          { type: "color", label: "Цвет", path: "hud.textColor" },
          { type: "range", label: "Прозрачность", path: "hud.opacity", min: 0, max: 100, step: 1, suffix: "%" }
        ]
      },
      {
        id: "coords", name: "Coordinates", category: "HUD", icon: "crosshair", enabledPath: "hud.coordinates",
        desc: "Координаты игрока - данные передает клиент",
        fields: [
          { type: "select", label: "Положение", path: "hud.position", options: DEFAULT_POSITIONS },
          { type: "range", label: "Масштаб", path: "hud.hudScale", min: 0.5, max: 2, step: 0.05, suffix: "x", decimals: 2 },
          { type: "color", label: "Цвет текста", path: "hud.textColor" }
        ]
      },

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const clone = (value) => JSON.parse(JSON.stringify(value));

    const esc = (value) => String(value ?? "")
      .replace(/[—–―−]/g, "-")
      .replaceAll("·", "")
      .replace(/\s{2,}/g, " ")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    // Единая очистка текста: длинные тире заменяются на "-", средняя точка удаляется.
    function sanitizeTextNodes(root = document.body) {
      if (!root) return;
      const clean = (value) => String(value)
        .replace(/[—–―−]/g, "-")
        .replaceAll("·", "")
        .replace(/\s{2,}/g, " ");
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        const parent = node.parentElement;
        if (!parent || /^(SCRIPT|STYLE)$/.test(parent.tagName)) continue;
        const cleaned = clean(node.nodeValue);
        if (cleaned !== node.nodeValue) node.nodeValue = cleaned;
      }
      root.querySelectorAll?.("[placeholder], [title], [aria-label]").forEach((element) => {
        for (const attribute of ["placeholder", "title", "aria-label"]) {
          if (!element.hasAttribute(attribute)) continue;
          const value = element.getAttribute(attribute);
          const cleaned = clean(value);
          if (cleaned !== value) element.setAttribute(attribute, cleaned);
        }
      });
    }

    function getPath(object, path) {
      return path.split(".").reduce((acc, part) => (acc == null ? undefined : acc[part]), object);
    }

    function setPath(object, path, value) {
      const parts = path.split(".");
      const last = parts.pop();
      const target = parts.reduce((acc, part) => {
        if (!acc[part] || typeof acc[part] !== "object") acc[part] = {};
        return acc[part];
      }, object);
      target[last] = value;
      return value;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, Number(value)));
    }

    function hexToRgb(hex) {
      const clean = String(hex).replace("#", "");
      const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
      const value = Number.parseInt(full, 16);
      if (Number.isNaN(value)) return "56, 255, 125";
      return `${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}`;
    }

    function icon(name, size = 14, extra = "") {
      return `<span class="ic ic-${size} ${extra}"><i data-lucide="${esc(name)}"></i></span>`;
    }

    let iconRefreshTimer = 0;
    function refreshIcons() {
      if (!window.lucide || typeof window.lucide.createIcons !== "function") return;
      window.clearTimeout(iconRefreshTimer);
      iconRefreshTimer = window.setTimeout(() => {
        try {
          window.lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
        } catch (error) {
          console.warn("GAYClient UI: не удалось обновить иконки", error);
        }
      }, 0);
    }

    function formatNumber(value, decimals) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "—";
      const places = Number.isInteger(decimals) ? decimals : (Number.isInteger(number) ? 0 : 2);
      return number.toFixed(places).replace(/\.?0+$/, (match) => (match.includes(".") ? "" : match));
    }

    function formatFieldValue(path, field = {}) {
      const value = getPath(state, path);
      if (value === undefined || value === null) return "—";
      if (typeof value === "boolean") return value ? "Да" : "Нет";
      if (field.min !== undefined || field.max !== undefined) {
        const suffix = field.suffix || "";
        return `${formatNumber(value, field.decimals)}${suffix}`;
      }
      return String(value);
    }

    function rangePercent(value, min, max) {
      const span = max - min;
      if (!span) return 0;
      return clamp(((Number(value) - min) / span) * 100, 0, 100);
    }

    function countEnabledModules() {
      return DEFAULT_MODULES.filter((module) => Boolean(getPath(state, module.enabledPath))).length;
    }

    function applyThemeVars() {
      const accent = state.interface.accent || "#38ff7d";
      const root = document.documentElement;
      root.style.setProperty("--accent", accent);
      root.style.setProperty("--accent-rgb", hexToRgb(accent));
      root.style.setProperty("--text", state.interface.textColor || "#effcf3");
      root.style.setProperty("--ui-bg", state.interface.bgColor || "#041009");
      const brightness = clamp(state.interface.brightness, 55, 115);
      document.body.style.filter = `brightness(${brightness / 100})`;

        shell.style.setProperty("--glow-strength", String(clamp(state.interface.glowIntensity, 0, 100) / 100));

    }

      ui.toastTimer = window.setTimeout(() => node.classList.remove("is-visible"), 2800);

      }
      if (state.activeTab === "stats") {
        return { title: "Предпросмотр", mode: "Статистика", icon: "bar-chart-3", subtitle: "Область будущих игровых показателей", tipTitle: "Данные не переданы", tipText: "FPS, CPS и системные показатели появятся после подключения клиента.", tipIcon: "activity" };
      }
      const map = {
        main: { title: "Предпросмотр", mode: "Главная", icon: "home", subtitle: "Краткая информация о клиенте", tipTitle: "GAYClient", tipText: "Используйте быстрые действия для перехода к нужному разделу настроек.", tipIcon: "sparkles" },
        hud: { title: "Предпросмотр", mode: "HUD", icon: "eye", subtitle: "Условное расположение элементов", tipTitle: "Совет", tipText: "Измените положение HUD, чтобы он не перекрывал важные элементы игры.", tipIcon: "lightbulb" },
        interface: { title: "Предпросмотр", mode: "Интерфейс", icon: "palette", subtitle: "Демонстрация выбранной темы", tipTitle: "Совет", tipText: "Тема применяется ко всему меню. Контраст текста сохранён для читаемости.", tipIcon: "lightbulb" },
        graphics: { title: "Предпросмотр эффектов", mode: "Графика", icon: "gamepad-2", subtitle: "Область для будущего рендера", tipTitle: "Область зарезервирована", tipText: "Текстура или готовая сцена персонажа передаётся внешним кодом клиента.", tipIcon: "layers" },
        sound: { title: "Предпросмотр", mode: "Звук", icon: "volume-2", subtitle: "Условные уровни громкости", tipTitle: "Без подключения", tipText: "Ползунки меняют только демонстрационное состояние интерфейса.", tipIcon: "headphones" },
        controls: { title: "Предпросмотр", mode: "Управление", icon: "sliders-horizontal", subtitle: "Клавиши и работа курсора", tipTitle: "Клавиши не захватываются", tipText: "Right Shift показан как назначение по умолчанию. Подключение клавиш — позже.", tipIcon: "keyboard" },
        other: { title: "Предпросмотр", mode: "Клиент", icon: "info", subtitle: "Сведения о демонстрационном интерфейсе", tipTitle: "GAYClient 1.1.5", tipText: "Это визуальная часть. Игровые модули и рендер не подключены.", tipIcon: "info" }
      };
      return map[state.activeSection] || map.hud;
    }

    function hudPreviewItems() {
      const items = [
        { on: state.hud.fps, icon: "activity", label: "FPS", value: "—" },
        { on: state.hud.cps, icon: "mouse-pointer-click", label: "CPS", value: "—" },
        { on: state.hud.clock, icon: "clock", label: "Часы", value: "--:--" },
        { on: state.hud.coordinates, icon: "crosshair", label: "Координаты", value: "— / —" },
        { on: state.hud.keystrokes, icon: "keyboard", label: "Клавиши", value: "W A S D" },
        { on: state.hud.perf, icon: "cpu", label: "CPU / RAM", value: "нет данных" },
        { on: state.hud.resolution, icon: "scan", label: "Разрешение", value: "—" },
        { on: state.hud.ping, icon: "wifi", label: "Пинг", value: "нет данных" }
      ];
      return items.filter((item) => item.on);
    }

    function hudSampleMarkup() {
      const items = hudPreviewItems();
      const visible = items.slice(0, 4);
      const hiddenCount = items.length - visible.length;
      const pos = DEFAULT_POSITIONS.includes(state.hud.position) ? state.hud.position : "Сверху слева";
      return `
        <div class="hud-sample" data-pos="${esc(pos)}" aria-label="Пример расположения HUD">
          <div class="hud-sample-top"><span>HUD · макет</span><span>пример</span></div>
          ${visible.length ? visible.map((item) => `
            <div class="hud-sample-row">${icon(item.icon, 11)}<span>${esc(item.label)}</span><span class="hud-val">${esc(item.value)}</span></div>`).join("")
            : `<div class="hud-sample-empty">Все элементы HUD выключены. Включите их на панели слева.</div>`}
          ${hiddenCount > 0 ? `<div class="hud-sample-row" style="height:14px;color:#617d69;font-size:6.5px;">ещё ${hiddenCount} элем.</div>` : ""}
        </div>
        ${state.hud.watermark ? `<div class="preview-watermark">${icon("droplet", 10)}GAYCLIENT</div>` : ""}`;
    }

    function graphicsStatusMarkup() {
      const entries = [
        ["chinaHat", "China Hat"],
        ["trail", "Trail"],
        ["jumpRings", "Jump Rings"]
      ];
      return `<div class="graphics-status">${entries.map(([key, label]) => {
        const on = Boolean(state.graphics[key].enabled);
        return `<div class="graphics-status-row ${on ? "is-on" : ""}"><span class="status-led"></span><span>${esc(label)}</span><span class="g-state">${on ? "ВКЛ" : "ВЫКЛ"}</span></div>`;
      }).join("")}</div>`;
    }

    function soundPreviewMarkup() {
      const lines = [
        ["Общая", state.sound.master],
        ["Интерфейс", state.sound.ui],
        ["Эффекты", state.sound.effects]
      ];
      return `<div class="sound-preview">${lines.map(([label, value]) => `
        <div class="sound-line"><span>${esc(label)}</span><span class="sound-bar"><i style="width:${clamp(value, 0, 100)}%"></i></span><span class="sound-num">${Math.round(value)}</span></div>`).join("")}</div>`;
    }

    function renderPreview() {
      const context = previewContext();
      const image = state.previewImage
        ? `<img class="preview-image" src="${esc(state.previewImage)}" alt="Переданная текстура предпросмотра">`
        : "";
      let overlay = "";
      if (state.activeTab === "settings" && ["main", "hud"].includes(state.activeSection) && !state.previewImage) overlay = hudSampleMarkup();
      if (state.activeTab === "settings" && state.activeSection === "graphics") overlay = graphicsStatusMarkup();
      if (state.activeTab === "settings" && state.activeSection === "sound") overlay = soundPreviewMarkup();
      if (state.activeTab === "mods") {
        const mod = DEFAULT_MODULES.find((item) => item.id === state.selectedMod) || DEFAULT_MODULES[0];
        const enabled = Boolean(getPath(state, mod.enabledPath));
        overlay = `<div class="graphics-status">
          <div class="graphics-status-row ${enabled ? "is-on" : ""}"><span class="status-led"></span><span>${esc(mod.name)}</span><span class="g-state">${enabled ? "ВКЛ" : "ВЫКЛ"}</span></div>
          <div class="graphics-status-row"><span class="status-led"></span><span>${esc(mod.category)}</span><span class="g-state">демо</span></div>
        </div>`;
      }
      if (state.activeTab === "profiles") {
        const profile = state.profiles.find((item) => item.id === state.selectedProfile) || state.profiles.find((item) => item.active);
        overlay = `<div class="graphics-status">
          <div class="graphics-status-row is-on"><span class="status-led"></span><span>${esc(profile ? profile.name : "Нет профиля")}</span><span class="g-state">профиль</span></div>
          <div class="graphics-status-row"><span class="status-led"></span><span>Тема: ${esc(state.interface.theme)}</span><span class="g-state">демо</span></div>
        </div>`;
      }
      if (state.activeTab === "stats") {
        overlay = `<div class="graphics-status">
          <div class="graphics-status-row"><span class="status-led"></span><span>FPS / CPS</span><span class="g-state">нет данных</span></div>
          <div class="graphics-status-row"><span class="status-led"></span><span>CPU / RAM</span><span class="g-state">нет данных</span></div>
        </div>`;
      }
      const extraNote = state.activeTab === "settings" && state.activeSection === "hud" ? "Условная схема" : "Нет данных";

      return `
        <div class="preview-head">
          <span class="preview-head-icon">${icon(context.icon, 15)}</span>
          <div class="preview-head-copy">
            <h2 class="preview-title">${esc(context.title)}<small>${esc(context.mode)}</small></h2>
            <p class="preview-subtitle">${esc(context.subtitle)}</p>
          </div>
          <button class="preview-expand" type="button" data-action="expand-preview" title="Развернуть предпросмотр" aria-label="Развернуть предпросмотр">${icon("maximize-2", 14)}</button>
        </div>
        <div class="preview-stage">
          <div class="stage-grid"></div>
          <div class="stage-scanlines"></div>
          <div class="stage-halo" aria-hidden="true"></div>
          <div class="stage-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="stage-ruler" aria-hidden="true">${Array.from({ length: 18 }, (_, i) => `<i class="${i % 3 === 0 ? "major" : ""}"></i>`).join("")}</div>
          ${image}
          <div class="preview-mode"><span class="dot"></span>Демонстрация</div>
          <div class="preview-scale">16:9 - область предпросмотра</div>
          ${overlay}
          ${state.previewImage ? "" : `
            <div class="empty-preview">
              <div class="empty-icon-wrap">${icon("image-off", 24)}</div>
              <h3>${state.activeTab === "settings" && state.activeSection === "graphics" ? "Предпросмотр эффектов недоступен" : "Предпросмотр недоступен"}</h3>
              <p>${state.activeTab === "settings" && state.activeSection === "graphics"
                ? "Здесь будет изображение персонажа или сцены, переданное клиентом. Игровая модель не имитируется."
                : "Область готова принять изображение или текстуру из существующего клиента."}</p>
              <span class="no-texture-tag">${icon("image", 10)}Нет переданной текстуры</span>
            </div>`}
          ${state.activeTab !== "settings" || !["hud", "main"].includes(state.activeSection) ? `
            <div class="preview-chips"><span class="pill demo">пример</span><span class="pill">${esc(extraNote)}</span></div>` : ""}
          <div class="stage-meta" aria-hidden="true">
            <span><b>Источник</b> клиент не подключен</span>
            <span><b>Размер</b> - x -</span>
            <span><b>Текстура</b> не передана</span>
            <span class="stage-meta-right">GAYClient 1.1.5</span>
          </div>
        </div>
        <div class="preview-tip">
          <span class="tip-icon">${icon(context.tipIcon, 16)}</span>
          <div class="tip-content"><div class="tip-title">${esc(context.tipTitle)}</div><div class="tip-text">${esc(context.tipText)}</div></div>
        </div>
        <div class="preview-note"><span>предпросмотр - визуальная заглушка</span><span>${state.activeTab === "settings" && state.activeSection === "hud" ? "макет - без игровых данных" : "ожидание данных клиента"}</span></div>`;
    }

    function render() {
      applyThemeVars();
      renderSidebar();
      renderTopHeader();
      const content = $("#contentColumn");
      if (content) content.innerHTML = renderContent();
      const preview = $("#previewPanel");
      if (preview) preview.innerHTML = renderPreview();
      sanitizeTextNodes($("#menuShell"));
      refreshIcons();
    }
  </script>

  <script>
    "use strict";

    /* ───────────────────────────────────────────────────────────────────────
       КОМПОНЕНТЫ НАСТРОЕК
    ─────────────────────────────────────────────────────────────────────── */

    function sectionHead(iconName, title, subtitle, badge = "демо") {
      return `
        <div class="section-head">
          <div class="section-icon">${icon(iconName, 19)}</div>
          <div class="section-copy">
            <h1 class="section-title">${esc(title)}</h1>
            <p class="section-subtitle">${esc(subtitle)}</p>
          </div>
          ${badge ? `<span class="section-badge">${esc(badge)}</span>` : ""}
        </div>
        <div class="content-divider"></div>`;
    }

    function group(title, body, options = {}) {
      return `
        <section class="settings-group ${options.className || ""}">
          <div class="group-header">
            <span class="group-mark"></span>
            <div class="group-title">${esc(title)}</div>
            ${options.note ? `<span class="group-note">${esc(options.note)}</span>` : ""}
            ${options.header || ""}
          </div>
          <div class="group-body">${body}</div>
        </section>`;
    }

    function switchMarkup(path, on, small = false) {
      return `<button class="switch ${small ? "small " : ""}${on ? "is-on" : ""}" type="button"
        role="switch" aria-checked="${on}" aria-label="Переключить ${esc(path)}"
        data-toggle="${esc(path)}"><span class="switch-knob"></span></button>`;
    }

    function toggleRow(path, label, iconName = "circle", note = "", options = {}) {
      const on = Boolean(getPath(state, path));
      return `
        <div class="setting-row">
          <span class="row-icon ${options.plain ? "plain" : ""}">${icon(iconName, 12)}</span>
          <span class="row-label">${esc(label)}${note ? `<span class="row-note">${esc(note)}</span>` : ""}</span>
          <span class="row-control">${switchMarkup(path, on, Boolean(options.small))}</span>
        </div>`;
    }

    function rangeRow(path, label, options = {}) {
      const min = options.min ?? 0;
      const max = options.max ?? 100;
      const step = options.step ?? 1;
      const decimals = options.decimals ?? (Number.isInteger(step) ? 0 : 2);
      const value = clamp(getPath(state, path) ?? min, min, max);
      const suffix = options.suffix || "";
      const readable = `${formatNumber(value, decimals)}${suffix}`;
      return `
        <div class="setting-row">
          ${options.noIcon ? "" : `<span class="row-icon">${icon(options.icon || "sliders-horizontal", 12)}</span>`}
          <span class="row-label">${esc(label)}${options.note ? `<span class="row-note">${esc(options.note)}</span>` : ""}</span>
          <span class="row-control ${options.wide ? "wide" : ""}">
            <span class="range-wrap ${options.compact ? "compact" : ""}">
              <input class="range" type="range" value="${value}" min="${min}" max="${max}" step="${step}"
                data-range="${esc(path)}" data-min="${min}" data-max="${max}" data-step="${step}"
                data-decimals="${decimals}" data-suffix="${esc(suffix)}"
                style="--p:${rangePercent(value, min, max)}%"
                aria-label="${esc(label)}">
              <output class="range-val" data-value-for="${esc(path)}">${readable}</output>
            </span>
          </span>
        </div>`;
    }

    function selectRow(path, label, options = [], iconName = "list", note = "") {
      const value = getPath(state, path);
      return `
        <div class="setting-row">
          <span class="row-icon">${icon(iconName, 12)}</span>
          <span class="row-label">${esc(label)}${note ? `<span class="row-note">${esc(note)}</span>` : ""}</span>
          <span class="row-control">
            <span class="select-shell">
              <select data-select="${esc(path)}" aria-label="${esc(label)}">
                ${options.map((option) => `<option value="${esc(option)}" ${String(value) === String(option) ? "selected" : ""}>${esc(option)}</option>`).join("")}
              </select>
            </span>
          </span>
        </div>`;
    }

    function colorRow(path, label, iconName = "palette") {
      const value = getPath(state, path) || "#38ff7d";
      return `
        <div class="setting-row">
          <span class="row-icon">${icon(iconName, 12)}</span>
          <span class="row-label">${esc(label)}</span>
          <span class="row-control">
            <label class="color-control" title="${esc(label)}">
              <input type="color" value="${esc(value)}" data-color="${esc(path)}" aria-label="${esc(label)}">
              <span class="color-hex" data-color-label="${esc(path)}">${esc(value)}</span>
            </label>
          </span>
        </div>`;
    }

    function staticRow(label, value, iconName = "dot") {
      return `
        <div class="setting-row">
          <span class="row-icon">${icon(iconName, 12)}</span>
          <span class="row-label">${esc(label)}</span>
          <span class="row-control"><span class="muted-value">${esc(value)}</span></span>
        </div>`;
    }

    function dataNote(text) {
      return `<div class="data-note">${icon("info", 11)}<span>${esc(text)}</span></div>`;
    }

    function positionTiles() {
      const entries = [
        ["Сверху слева", "СЛ"],
        ["Сверху справа", "СП"],
        ["Снизу слева", "НЛ"],
        ["Снизу справа", "НП"],
        ["Собственная позиция", "Своя"]
      ];
      return `
        <div class="position-grid" style="grid-template-columns:repeat(5,1fr)" aria-label="Быстрый выбор положения">
          ${entries.map(([position, short]) => `
            <button class="position-tile ${state.hud.position === position ? "is-active" : ""}" type="button"
              data-position="${esc(position)}" title="${esc(position)}" aria-label="${esc(position)}">
              <span>${esc(short)}</span>
            </button>`).join("")}
        </div>`;
    }

    function actionButtons() {
      return `
        <div class="action-row">
          <button class="btn primary grow" type="button" data-action="open-hud-editor">${icon("panels-top-left", 13)}Открыть редактор HUD</button>
          <button class="btn" type="button" data-action="reset-hud">${icon("rotate-ccw", 13)}Сбросить</button>
        </div>`;
    }

    /* ───────────────────────────────────────────────────────────────────────
       СОДЕРЖИМОЕ РАЗДЕЛОВ
    ─────────────────────────────────────────────────────────────────────── */

    function renderSettingsContent() {
      switch (state.activeSection) {
        case "main": return renderMain();
        case "hud": return renderHud();
        case "interface": return renderInterface();
        case "graphics": return renderGraphics();
        case "sound": return renderSound();
        case "controls": return renderControls();
        case "other": return renderOther();
        default: return renderHud();
      }
    }

    function renderMain() {
      const enabled = DEFAULT_MODULES.filter((module) => Boolean(getPath(state, module.enabledPath)));
      return `
        ${sectionHead("home", "Главная", "Обзор демонстрационного интерфейса GAYClient", "1.1.5")}
        <div class="home-hero">
          <div class="hero-eyebrow">${icon("shield-check", 11)}Визуальная часть клиента</div>
          <div class="hero-title">GAYCLIENT</div>
          <p class="hero-desc">Единое внутриигровое меню для Minecraft Bedrock. Настройте HUD, оформление и эффекты в одном окне.</p>
          <div class="chips">
            <span class="pill green">${icon("power", 9)}Демо-режим</span>
            <span class="pill">Версия 1.1.5</span>
            <span class="pill demo">Клиент не подключён</span>
          </div>
        </div>
        ${group("Быстрые действия", `
          <div class="mini-cards">
            <button class="quick-card" type="button" data-action="section" data-section="hud">${icon("monitor", 14)}<span>Настроить HUD</span></button>
            <button class="quick-card" type="button" data-action="section" data-section="graphics">${icon("sparkles", 14)}<span>Эффекты графики</span></button>
            <button class="quick-card" type="button" data-action="section" data-section="interface">${icon("palette", 14)}<span>Оформление меню</span></button>
            <button class="quick-card" type="button" data-action="tab" data-tab="mods">${icon("box", 14)}<span>Моды</span></button>
            <button class="quick-card" type="button" data-action="tab" data-tab="profiles">${icon("user-round", 14)}<span>Профили</span></button>
            <button class="quick-card" type="button" data-action="tab" data-tab="stats">${icon("bar-chart-3", 14)}<span>Статистика</span></button>
          </div>
        `, { note: "переход" })}
        ${group("Включённые модули", `
          <div class="chips">
            ${enabled.length ? enabled.map((module) => `<span class="pill green">${icon(module.icon, 9)}${esc(module.name)}</span>`).join("") : `<span class="muted-value">Нет включённых модулей</span>`}
          </div>
          <div class="module-details-footer" style="padding-left:0;padding-right:0;margin-top:6px;">
            <span>Всего активно: <b data-enabled-count style="color:var(--accent);font-weight:700;">${enabled.length}</b></span>
            <span>демонстрационные переключатели</span>
          </div>
        `, { note: "состояние демо" })}
        ${group("Сведения о клиенте", `
          ${staticRow("Название клиента", "GAYClient", "badge-info")}
          ${staticRow("Версия интерфейса", "1.1.5 · демонстрация", "tag")}
          ${staticRow("Подключение к игре", "Не подключено", "unplug")}
        `)}
        ${dataNote("Значения модулей здесь условные. Реальные игровые данные будет передавать существующий клиент после подключения.")}`;
    }

    function renderHud() {
      return `
        ${sectionHead("monitor", "HUD", "Настройте отображение игрового интерфейса", "визуал")}
        ${group("Основные настройки", `
          ${toggleRow("hud.fps", "Показывать FPS", "activity")}
          ${toggleRow("hud.cps", "Показывать CPS", "mouse-pointer-click")}
          ${toggleRow("hud.keystrokes", "Показывать нажатые клавиши", "keyboard")}
          ${toggleRow("hud.clock", "Показывать часы", "clock")}
          ${toggleRow("hud.watermark", "Показывать водяной знак", "droplet")}
          ${toggleRow("hud.coordinates", "Показывать координаты", "crosshair")}
          ${toggleRow("hud.perf", "Показывать производительность CPU и RAM", "cpu")}
          ${toggleRow("hud.resolution", "Показывать разрешение", "scan")}
          ${toggleRow("hud.modulesEnabled", "Показывать список активных модулей", "layers")}
          ${toggleRow("hud.ping", "Показывать пинг", "wifi", "если доступен")}
        `, { note: "10 параметров" })}
        ${group("Размер и внешний вид", `
          ${rangeRow("hud.hudScale", "Масштаб HUD", { min: 0.5, max: 2, step: 0.05, suffix: "x", decimals: 2, icon: "scaling" })}
          ${rangeRow("hud.hudSize", "Размер элементов", { min: 0.5, max: 2, step: 0.05, suffix: "x", decimals: 2, icon: "maximize" })}
          ${rangeRow("hud.opacity", "Прозрачность", { min: 0, max: 100, step: 1, suffix: "%", icon: "eye" })}
          ${colorRow("hud.textColor", "Цвет текста", "type")}
          ${rangeRow("hud.spacing", "Отступы между элементами", { min: 0, max: 24, step: 1, suffix: "px", icon: "move" })}
          ${rangeRow("hud.padding", "Внутренние отступы", { min: 0, max: 24, step: 1, suffix: "px", icon: "box" })}
          ${rangeRow("hud.radius", "Скругление карточек", { min: 0, max: 24, step: 1, suffix: "px", icon: "circle-dot" })}
        `)}
        ${group("Положение", `
          ${selectRow("hud.position", "Позиция HUD", DEFAULT_POSITIONS, "layout-grid")}

    function effectCard(key, title, description, iconName, rows) {

          ${rangeRow("graphics.chinaHat.floatAmplitude", "Амплитуда плавания", { min: 0, max: 1, step: 0.05, decimals: 2, suffix: "ед.", icon: "waves" })}

        `)}
        ${effectCard("trail", "Trail", "След за движением персонажа", "wind", `
          ${toggleRow("graphics.trail.fill", "Заливка следа", "paint-bucket", "", { small: true })}
          ${colorRow("graphics.trail.color", "Цвет следа", "palette")}

          ${rangeRow("graphics.trail.rainbowSpeed", "Скорость радуги", { min: 0, max: 100, step: 1, suffix: "%", icon: "gauge" })}
          ${rangeRow("graphics.trail.opacity", "Прозрачность", { min: 0, max: 100, step: 1, suffix: "%", icon: "eye" })}
          ${rangeRow("graphics.trail.height", "Высота следа", { min: 0.2, max: 3, step: 0.05, decimals: 2, suffix: "ед.", icon: "move-vertical" })}
          ${rangeRow("graphics.trail.life", "Время жизни следа", { min: 0.2, max: 4, step: 0.1, decimals: 1, suffix: "с", icon: "timer" })}
        `)}
        ${effectCard("jumpRings", "Jump Rings", "Кольца при прыжке", "sparkles", `
          ${colorRow("graphics.jumpRings.color", "Цвет", "palette")}
          ${toggleRow("graphics.jumpRings.rainbow", "Радужный режим", "rainbow", "", { small: true })}
          ${rangeRow("graphics.jumpRings.rainbowSpeed", "Скорость радуги", { min: 0, max: 100, step: 1, suffix: "%", icon: "gauge" })}
          ${rangeRow("graphics.jumpRings.radius", "Радиус", { min: 0.2, max: 3, step: 0.05, decimals: 2, suffix: "ед.", icon: "circle" })}

        <div class="action-row">

          <button class="btn" type="button" data-action="reset-graphics">${icon("rotate-ccw", 13)}Сбросить</button>

        ${dataNote("Справа зарезервирована большая область под изображение персонажа или эффектов. Без переданной текстуры показывается заглушка.")}`;

    function renderSound() {
      return `
        ${sectionHead("volume-2", "Звук", "Громкость меню и демонстрационных эффектов", "демо")}
        ${group("Основные настройки", `
          ${toggleRow("sound.muted", "Отключить звук", "volume-x")}
          ${rangeRow("sound.master", "Общая громкость", { min: 0, max: 100, step: 1, suffix: "%", icon: "volume-2" })}
          ${rangeRow("sound.ui", "Громкость интерфейса", { min: 0, max: 100, step: 1, suffix: "%", icon: "mouse-pointer" })}
          ${rangeRow("sound.effects", "Громкость эффектов", { min: 0, max: 100, step: 1, suffix: "%", icon: "audio-lines" })}
        `, { note: "только визуал" })}
        ${group("Устройство вывода", `
          ${selectRow("sound.device", "Аудиоустройство", ["Системное устройство", "Устройство по умолчанию", "Без вывода"], "headphones")}
        `)}
        <div class="action-row">
          <button class="btn primary grow" type="button" data-action="sound-check">${icon("play", 13)}Проверить звук</button>
          <button class="btn" type="button" data-action="reset-sound">${icon("rotate-ccw", 13)}Сбросить</button>
        </div>
        ${dataNote("Уровни звука хранятся только в демонстрационном состоянии. Связь с аудиосистемой клиента будет добавлена позже.")}`;
    }

    function renderControls() {
      const keyValue = state.controls.menuKey || "Right Shift";
      return `
        ${sectionHead("sliders-horizontal", "Управление", "Клавиши открытия меню и работа курсора", "демо")}
        ${group("Клавиши", `
          <div class="setting-row">
            <span class="row-icon">${icon("command", 12)}</span>
            <span class="row-label">Открытие меню<span class="row-note">по умолчанию</span></span>
            <span class="row-control">
              <button class="btn tiny primary" type="button" data-action="rebind-key">${icon(ui.capturedKey ? "radio" : "keyboard", 12)}<span class="keycap" style="min-width:auto;height:16px">${ui.capturedKey ? "Нажмите клавишу…" : esc(keyValue)}</span></button>
            </span>
          </div>
          ${toggleRow("controls.moduleHotkeys", "Горячие клавиши модулей", "keyboard", "", { small: true })}
        `)}
        ${group("Курсор и прокрутка", `
          ${toggleRow("controls.cursor", "Показывать курсор при открытом меню", "mouse-pointer-2")}
          ${toggleRow("controls.scroll", "Прокрутка содержимого колесом", "mouse")}
          ${staticRow("Закрытие меню", keyValue, "log-out")}
        `)}
        ${group("Назначение по умолчанию", `
          ${staticRow("Открыть / закрыть меню", "Right Shift", "keyboard")}
          ${staticRow("Фокус на содержимом", "Автоматически", "focus")}
          ${staticRow("Захват игровой мыши", "Не подключён", "unplug")}
        `)}
        <div class="action-row">
          <button class="btn primary grow" type="button" data-action="reset-controls">${icon("rotate-ccw", 13)}Вернуть по умолчанию</button>
        </div>
        ${dataNote("Клавиша Right Shift показана как назначение по умолчанию. Подключение клавиш и игровой мыши выполнит другой разработчик.")}`;
    }

    function renderOther() {
      return `
        ${sectionHead("ellipsis", "Прочее", "Информация о клиенте и сброс настроек", "1.1.5")}
        ${group("Сведения", `
          ${staticRow("Название клиента", "GAYClient", "badge-info")}
          ${staticRow("Версия", "1.1.5", "tag")}
          ${staticRow("Платформа", "Minecraft Bedrock / Windows", "monitor")}

          ${staticRow("Подключение", "Нет данных", "unplug")}
        `)}
        ${group("Сброс", `
          <p class="mod-detail-desc">Сброс вернёт демонстрационные значения HUD, оформления, эффектов и звука. Профили останутся без изменений.</p>
          <div class="action-row" style="padding: 0 10px 8px;">
            <button class="btn danger grow" type="button" data-action="reset-all">${icon("rotate-ccw", 13)}Сбросить все настройки</button>
          </div>
        `)}
        ${dataNote("Игровые модули, хуки и рендер намеренно не подключены. Эта часть отвечает только за визуальный интерфейс и демонстрационное состояние.")}`;
    }

    function renderContent() {
      if (state.activeTab === "mods") return renderMods();
      if (state.activeTab === "profiles") return renderProfiles();
      if (state.activeTab === "stats") return renderStats();
      return renderSettingsContent();
