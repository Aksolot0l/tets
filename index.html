  </script>

  <script>
    "use strict";

    /* ───────────────────────────────────────────────────────────────────────
       МОДЫ
    ─────────────────────────────────────────────────────────────────────── */

    function renderModuleField(field) {
      if (field.type === "range") return rangeRow(field.path, field.label, field);
      if (field.type === "select") return selectRow(field.path, field.label, field.options, "layout-grid");
      if (field.type === "color") return colorRow(field.path, field.label);
      if (field.type === "toggle") return toggleRow(field.path, field.label, "toggle-left", "", { small: true });
      return "";
    }

    function renderMods() {
      const categories = ["all", "HUD", "Графика"];
      const selected = DEFAULT_MODULES.find((module) => module.id === state.selectedMod) || DEFAULT_MODULES[0];
      const activeSelected = Boolean(getPath(state, selected.enabledPath));
      const enabledCount = countEnabledModules();
      return `
        ${sectionHead("box", "Моды", "Демонстрационный список модулей клиента", `${enabledCount} вкл.`)}
        <div class="mod-toolbar">
          <label class="search-wrap" style="display:block;flex:1;">
            <span class="search-icon">${icon("search", 13)}</span>
            <input class="text-input" id="modSearch" type="search" autocomplete="off" value="${esc(state.modsQuery)}"
              placeholder="Поиск по названиям модулей…" aria-label="Поиск модуля" data-search="mods">
          </label>
        </div>
        <div class="category-chips" role="group" aria-label="Категории модулей">
          ${categories.map((category) => `
            <button class="chip-btn ${state.modsCategory === category ? "is-active" : ""}" type="button"
              data-action="mod-category" data-category="${category}">
              ${category === "all" ? "Все" : category}
            </button>`).join("")}
        </div>
        <div class="mod-list" id="modList" aria-label="Список модулей">
          ${DEFAULT_MODULES.map((module) => {
            const on = Boolean(getPath(state, module.enabledPath));
            return `
              <div class="mod-card ${selected.id === module.id ? "is-selected" : ""}" data-mod-card
                data-name="${esc(module.name.toLowerCase())}" data-category="${esc(module.category)}"
                data-action="select-mod" data-mod="${module.id}" role="button" tabindex="0" aria-label="${esc(module.name)}">
                <span class="mod-icon">${icon(module.icon, 13)}</span>
                <span class="mod-copy">
                  <span class="mod-name">${esc(module.name)}</span>
                  <span class="mod-desc">${esc(module.desc)}</span>
                </span>
                <span class="mod-tag">${esc(module.category)}</span>
                ${switchMarkup(module.enabledPath, on, true)}
              </div>`;
          }).join("")}
          <div class="no-results" id="modNoResults" ${state.modsQuery ? "" : "hidden"}>По этому запросу модули не найдены.</div>
        </div>
        ${group("Настройки модуля", `
          <div class="mod-detail-head">
            <span class="mod-icon" style="width:32px;height:32px;flex-basis:32px;">${icon(selected.icon, 15)}</span>
            <div style="flex:1;min-width:0;">
              <div class="mod-name">${esc(selected.name)}</div>
              <div class="mod-desc">${esc(selected.desc)}</div>
            </div>
            ${switchMarkup(selected.enabledPath, activeSelected, true)}
          </div>
          <div class="mod-detail-desc">Параметры относятся к демонстрационному состоянию. Значения не передаются в игру.</div>
          ${selected.fields && selected.fields.length ? selected.fields.map(renderModuleField).join("") : `<div class="no-results">У модуля пока нет визуальных параметров.</div>`}
          <div class="module-details-footer">
            <span>${esc(selected.category)} · идентификатор: ${esc(selected.id)}</span>
            <span data-module-state>${activeSelected ? "включён (демо)" : "выключен (демо)"}</span>
          </div>
        `, { note: "визуал" })}
        ${dataNote("Фактические данные FPS, CPS, координат и системные показатели должен передавать существующий клиент. Список модулей демонстрационный.")}`;
    }

    /* ───────────────────────────────────────────────────────────────────────
       ПРОФИЛИ
    ─────────────────────────────────────────────────────────────────────── */

    function renderProfiles() {
      const selected = state.profiles.find((profile) => profile.id === state.selectedProfile) || state.profiles[0];
      const active = state.profiles.find((profile) => profile.active) || state.profiles[0];
      return `
        ${sectionHead("user-round", "Профили", "Наборы настроек интерфейса", "демо")}
        ${group("Список профилей", `
          <div class="profile-list">
            ${state.profiles.map((profile) => `
              <div class="profile-card ${profile.id === selected?.id ? "is-selected" : ""} ${profile.id === selected?.id ? "is-active" : ""}"
                data-action="profile-select" data-profile="${esc(profile.id)}" role="button" tabindex="0" aria-label="Выбрать профиль ${esc(profile.name)}">
                <span class="profile-avatar">${icon(profile.active ? "user-round-check" : "user-round", 14)}</span>
                <span class="profile-info">
                  <span class="profile-name">${esc(profile.name)}</span>
                  <span class="profile-meta">${profile.active ? "Активный профиль" : "Неактивен"} · демо</span>
                </span>
                ${profile.active ? `<span class="profile-active-tag">активен</span>` : ""}
              </div>`).join("")}
          </div>
          <div class="action-row" style="padding:8px 3px 3px;">
            <button class="btn primary grow" type="button" data-action="profile-create">${icon("plus", 12)}Создать профиль</button>
          </div>
        `, { note: `в списке: ${state.profiles.length}` })}
        ${group("Выбранный профиль", selected ? `
          <div class="selected-profile">
            <span class="profile-avatar">${icon("user-round", 17)}</span>
            <div class="profile-info">
              <div class="profile-name">${esc(selected.name)}</div>
              <div class="profile-meta">${esc(selected.note || "Демонстрационный профиль")}</div>
            </div>
            ${selected.active ? `<span class="profile-active-tag">активен</span>` : `<span class="pill demo">не активен</span>`}
          </div>
          <div class="profile-actions">
            <div class="action-row">
              <button class="btn primary grow" type="button" data-action="profile-save">${icon("save", 12)}Сохранить настройки</button>
              ${selected.active ? `<span class="pill green" style="align-self:center;">${icon("check", 9)}текущий</span>` : `<button class="btn grow" type="button" data-action="profile-activate">${icon("check", 12)}Сделать активным</button>`}
            </div>
            <div class="action-row">
              <button class="btn grow" type="button" data-action="profile-rename">${icon("pencil", 12)}Переименовать</button>
              <button class="btn danger grow" type="button" data-action="profile-delete">${icon("trash-2", 12)}Удалить</button>
            </div>
          </div>
        ` : `<div class="no-results">Выберите профиль из списка.</div>`, { note: "действия демо" })}
        ${dataNote("Профили не сохраняются между запусками. Здесь реализована только визуальная часть создания, выбора, переименования и удаления.")}`;
    }

    /* ───────────────────────────────────────────────────────────────────────
       СТАТИСТИКА
    ─────────────────────────────────────────────────────────────────────── */

    function statCard(iconName, label, value, foot, options = {}) {
      return `
        <div class="stat-card ${options.wide ? "wide" : ""}">
          <div class="stat-head"><span class="stat-icon">${icon(iconName, 12)}</span><span>${esc(label)}</span></div>
          <div class="stat-value ${options.dim === false ? "" : "dim"}">${esc(value)}</div>
          <div class="stat-foot">${esc(foot)}</div>
        </div>`;
    }

    function renderStats() {
      const enabled = countEnabledModules();
      return `
        ${sectionHead("bar-chart-3", "Статистика", "Показатели, ожидающие подключения клиента", "нет данных")}
        <div class="stat-banner">${icon("triangle-alert", 12)}<span>Клиент не подключён. Реальные игровые значения отсутствуют и не подменяются демонстрационными.</span></div>
        <div class="stats-grid" style="margin-top:8px;">
          ${statCard("activity", "FPS", "Нет данных", "Источник: клиент игры")}
          ${statCard("mouse-pointer-click", "CPS", "Нет данных", "Источник: клиент игры")}
          ${statCard("layers", "Модулей включено", `${enabled}`, "По текущим демонстрационным переключателям", { dim: false })}
          ${statCard("wifi", "Пинг", "Нет данных", "Если показатель доступен")}
          ${statCard("cpu", "Загрузка CPU", "Нет данных", "Системные показатели клиента")}
          ${statCard("memory-stick", "Использование RAM", "Нет данных", "Системные показатели клиента")}
          ${statCard("scan", "Разрешение", "Нет данных", "Передаётся игровым окном")}
          ${statCard("clock-3", "Время в игре", "Нет данных", "Не передано клиентом")}
        </div>
        ${group("Динамика показателей", `
          <div class="empty-chart"></div>
          <div class="module-details-footer" style="padding-left:0;padding-right:0;">
            <span>График без данных</span><span>подключение позже</span>
          </div>
        `, { note: "ожидание" })}
        ${group("Источники", `
          ${staticRow("Игровые показатели", "Клиент Minecraft", "gamepad-2")}
          ${staticRow("Системные показатели", "Не переданы", "unplug")}
          ${staticRow("Состояние подключения", "Не подключено", "wifi-off")}
        `)}
        <div class="action-row">
          <button class="btn primary grow" type="button" data-action="stats-refresh">${icon("refresh-cw", 13)}Запросить данные</button>
        </div>`;
    }
  </script>

  <script>
    "use strict";

    /* ───────────────────────────────────────────────────────────────────────
       ДЕЙСТВИЯ И СВЯЗЫВАНИЕ
    ─────────────────────────────────────────────────────────────────────── */

    function refreshPreviewOnly() {
      const host = $("#previewPanel");
      if (!host) return;
      host.innerHTML = renderPreview();
      sanitizeTextNodes(host);
      refreshIcons();
    }

    function syncCounts() {
      const count = countEnabledModules();
      $$("[data-enabled-count]").forEach((node) => { node.textContent = String(count); });
      $$("[data-side-modules]").forEach((node) => { node.textContent = `${count} / ${DEFAULT_MODULES.length}`; });
      const meter = $("#sidebar .fill-meter");
      if (meter) {
        const filled = Math.max(3, Math.round((count / DEFAULT_MODULES.length) * 14));
        $$("i", meter).forEach((segment, index) => segment.classList.toggle("on", index < filled));
      }
      if (state.activeTab === "mods") {
        const badge = $("#contentColumn .section-badge");
        if (badge) badge.textContent = `${count} вкл.`;
      }
    }

    function syncModuleStateLabel() {
      const module = DEFAULT_MODULES.find((item) => item.id === state.selectedMod);
      const node = $("[data-module-state]");
      if (!module || !node) return;
      node.textContent = getPath(state, module.enabledPath) ? "включён (демо)" : "выключен (демо)";
    }

    function handleToggle(path) {
      const next = !Boolean(getPath(state, path));
      setPath(state, path, next);
      $$("[data-toggle]").forEach((button) => {
        if (button.dataset.toggle !== path) return;
        button.classList.toggle("is-on", next);
        button.setAttribute("aria-checked", String(next));
      });
      if (path.startsWith("interface.")) applyThemeVars();
      syncCounts();
      syncModuleStateLabel();
      refreshPreviewOnly();
    }

    function handleRange(input) {
      const path = input.dataset.range;
      if (!path) return;
      const min = Number(input.dataset.min);
      const max = Number(input.dataset.max);
      const decimals = Number(input.dataset.decimals ?? 0);
      const suffix = input.dataset.suffix || "";
      const value = clamp(Number(input.value), min, max);
      setPath(state, path, value);
      input.value = String(value);
      input.style.setProperty("--p", `${rangePercent(value, min, max)}%`);
      $$("[data-value-for]").forEach((node) => {
        if (node.dataset.valueFor === path) node.textContent = `${formatNumber(value, decimals)}${suffix}`;
      });
      if (path === "interface.brightness") applyThemeVars();
    }

    function syncThemeCards() {
      $$(".theme-card").forEach((card) => {
        const active = card.dataset.theme === state.interface.theme;
        card.classList.toggle("is-active", active);
        card.setAttribute("aria-pressed", String(active));
      });
    }

    function handleColor(input) {
      const path = input.dataset.color;
      if (!path) return;
      const value = input.value.toLowerCase();
      setPath(state, path, value);
      $$("[data-color-label]").forEach((label) => {
        if (label.dataset.colorLabel === path) label.textContent = value;
      });
      $$("[data-color]").forEach((other) => {
        if (other !== input && other.dataset.color === path) other.value = value;
      });
      if (path === "interface.accent") {
        const matched = THEMES.find((theme) => theme.accent.toLowerCase() === value);
        if (matched) state.interface.theme = matched.name;
        syncThemeCards();
        applyThemeVars();
        refreshPreviewOnly();
      }
      if (path === "interface.textColor" || path === "interface.bgColor") applyThemeVars();
      if (path.startsWith("hud.")) refreshPreviewOnly();
    }

    function handleSelect(select) {
      const path = select.dataset.select;
      if (!path) return;
      setPath(state, path, select.value);
      if (path === "hud.position") {
        $$(".position-tile").forEach((tile) => {
          tile.classList.toggle("is-active", tile.dataset.position === select.value);
        });
      }
      if (path.startsWith("hud.") || path.startsWith("graphics.")) refreshPreviewOnly();
      if (path === "sound.device") toast(`Демонстрационное устройство: ${select.value}`, "headphones");
    }

    function filterModsInPlace() {
      const query = String(state.modsQuery || "").trim().toLowerCase();
      let visible = 0;
      $$("[data-mod-card]").forEach((card) => {
        const name = (card.dataset.name || "").toLowerCase();
        const category = card.dataset.category || "";
        const matchesQuery = !query || name.includes(query);
        const matchesCategory = state.modsCategory === "all" || category === state.modsCategory;
        const show = matchesQuery && matchesCategory;
        card.hidden = !show;
        if (show) visible += 1;
      });
      const empty = $("#modNoResults");
      if (empty) {
        empty.hidden = visible > 0;
        empty.textContent = query
          ? "По этому запросу модули не найдены."
          : "В этой категории пока нет модулей.";
      }
    }

    function rerender(preserveScroll = false) {
      const content = $("#contentColumn");
      const scroll = content ? content.scrollTop : 0;
      render();
      const freshContent = $("#contentColumn");
      if (freshContent) freshContent.scrollTop = preserveScroll ? scroll : 0;
      if (state.activeTab === "mods") filterModsInPlace();
    }

    /* ───────────────────────────────────────────────────────────────────────
       ДИАЛОГИ
    ─────────────────────────────────────────────────────────────────────── */

    function closeDialog() {
      const layer = $("#modalLayer");
      if (!layer) return;
      layer.classList.remove("is-open");
      layer.setAttribute("aria-hidden", "true");
      $("#dialogBox").innerHTML = "";
    }

    function openDialog(options = {}) {
      const layer = $("#modalLayer");
      const box = $("#dialogBox");
      if (!layer || !box) return;
      const hasInput = Object.prototype.hasOwnProperty.call(options, "input");
      box.innerHTML = `
        <div class="dialog-head">
          <span class="dialog-icon">${icon(options.icon || "info", 15)}</span>
          <div class="dialog-title" id="dialogTitle">${esc(options.title || "GAYClient")}</div>
          <button class="dialog-close" type="button" data-dialog-close aria-label="Закрыть диалог">${icon("x", 13)}</button>
        </div>
        <p class="dialog-desc">${esc(options.desc || "")}</p>
        ${hasInput ? `<input class="text-input dialog-input" id="dialogInput" type="text" maxlength="42"
          autocomplete="off" value="${esc(options.input || "")}" placeholder="${esc(options.placeholder || "Введите значение")}"
          aria-label="${esc(options.inputLabel || "Значение")}">` : ""}
        <div class="dialog-error" id="dialogError" aria-live="polite"></div>
        <div class="dialog-actions">
          <button class="btn ghost" type="button" data-dialog-close>${options.cancelLabel || "Отмена"}</button>
          <button class="btn ${options.danger ? "danger" : "primary"}" type="button" data-dialog-confirm>
            ${esc(options.confirmLabel || "Понятно")}
          </button>
        </div>`;
      layer.classList.add("is-open");
      layer.setAttribute("aria-hidden", "false");
      sanitizeTextNodes(box);
      refreshIcons();
      const input = $("#dialogInput");
      const error = $("#dialogError");
      const submit = () => {
        const value = hasInput ? String(input?.value || "").trim() : "";
        if (hasInput) {
          if (!value) {
            if (error) error.textContent = "Введите значение.";
            input?.focus();
            return;
          }
          if (typeof options.validate === "function") {
            const message = options.validate(value);
            if (message) {
              if (error) error.textContent = message;
              input?.focus();
              return;
            }
          }
        }
        const callback = options.onConfirm;
        closeDialog();
        if (typeof callback === "function") callback(value);
      };
      box.querySelector("[data-dialog-confirm]")?.addEventListener("click", submit);
      box.querySelectorAll("[data-dialog-close]").forEach((button) => button.addEventListener("click", closeDialog));
      if (input) {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            submit();
          }
        });
        window.setTimeout(() => {
          input.focus();
          input.select();
        }, 40);
      } else {
        window.setTimeout(() => box.querySelector("[data-dialog-confirm]")?.focus(), 40);
      }
      layer.onclick = (event) => {
        if (event.target === layer) closeDialog();
      };
    }

    function openInfoDialog(title, desc, iconName = "info") {
      openDialog({ title, desc, icon: iconName, confirmLabel: "Понятно" });
    }

    function resetPart(part, message) {
      const fresh = makeDefaultState();
      if (part === "all") {
        const keep = {
          activeTab: state.activeTab,
          activeSection: state.activeSection,
          profiles: state.profiles,
          selectedProfile: state.selectedProfile
        };
        Object.assign(state, fresh, keep);
      } else {
        state[part] = fresh[part];
      }
      rerender(false);
      toast(message, "rotate-ccw");
    }

    function openPreviewImageDialog() {
      openDialog({
        title: "Передать область предпросмотра",
        desc: "Визуальная часть принимает изображение извне. Укажите адрес картинки или data URL — это демонстрация будущего подключения, а не игровая модель.",
        icon: "image",
        input: state.previewImage || "",
        placeholder: "https://… или data:image/…",
        inputLabel: "Адрес изображения",
        confirmLabel: "Применить",
        validate: (value) => {
          if (value && !/^(https?:\/\/|data:image\/)/i.test(value)) return "Укажите URL изображения или data:image URL.";
          return "";
        },
        onConfirm: (value) => {
          state.previewImage = value;
          rerender(false);
          toast(value ? "Изображение области предпросмотра обновлено (демо)." : "Изображение предпросмотра очищено.", "image");
        }
      });
    }

    /* ───────────────────────────────────────────────────────────────────────
       ОБРАБОТКА ДЕЙСТВИЙ
    ─────────────────────────────────────────────────────────────────────── */

    document.addEventListener("click", (event) => {
      const switchNode = event.target.closest("[data-toggle]");
      if (switchNode) {
        event.preventDefault();
        handleToggle(switchNode.dataset.toggle);
        return;
      }

      const positionNode = event.target.closest("[data-position]");
      if (positionNode) {
        state.hud.position = positionNode.dataset.position;
        $$(".position-tile").forEach((tile) => tile.classList.toggle("is-active", tile.dataset.position === state.hud.position));
        const select = $('[data-select="hud.position"]');
        if (select) select.value = state.hud.position;
        refreshPreviewOnly();
        return;
      }

      const actionNode = event.target.closest("[data-action]");
      if (!actionNode) return;
      const action = actionNode.dataset.action;

      switch (action) {
        case "tab": {
          state.activeTab = actionNode.dataset.tab;
          rerender(false);
          break;
        }
        case "section": {
          state.activeTab = "settings";
          state.activeSection = actionNode.dataset.section || "main";
          rerender(false);
          break;
        }
        case "theme": {
          state.interface.theme = actionNode.dataset.theme;
          state.interface.accent = actionNode.dataset.accent || "#38ff7d";
          rerender(false);
          toast(`Тема оформления: ${state.interface.theme}`, "palette");
          break;
        }
        case "toggle-effect-group": {
          const key = actionNode.dataset.key;
          state.openEffects[key] = !state.openEffects[key];
          const card = actionNode.closest(".effect-card");
          card?.classList.toggle("is-open", Boolean(state.openEffects[key]));
          actionNode.setAttribute("aria-expanded", String(Boolean(state.openEffects[key])));
          break;
        }
        case "select-mod": {
          state.selectedMod = actionNode.dataset.mod;
          rerender(true);
          break;
        }
        case "mod-category": {
          state.modsCategory = actionNode.dataset.category || "all";
          rerender(true);
          break;
        }
        case "open-hud-editor": {
          openInfoDialog(
            "Редактор HUD",
            "Визуальная кнопка готова для подключения. В существующем клиенте здесь откроется редактор расположения элементов HUD. Сейчас доступен демонстрационный макет справа.",
            "panels-top-left"
          );
          break;
        }
        case "reset-hud": resetPart("hud", "Настройки HUD сброшены (демо)."); break;
        case "reset-interface": resetPart("interface", "Оформление сброшено (демо)."); break;
        case "reset-graphics": resetPart("graphics", "Настройки эффектов сброшены (демо)."); break;
        case "reset-sound": resetPart("sound", "Настройки звука сброшены (демо)."); break;
        case "reset-controls": resetPart("controls", "Управление возвращено к демонстрационным значениям."); break;
        case "reset-all": {
          openDialog({
            title: "Сбросить все настройки?",
            desc: "Будут сброшены HUD, оформление, эффекты, звук и управление. Демонстрационные профили останутся.",
            icon: "rotate-ccw",
            confirmLabel: "Сбросить",
            danger: true,
            onConfirm: () => resetPart("all", "Все демонстрационные настройки сброшены.")
          });
          break;
        }
        case "expand-preview": {
          openInfoDialog(
            "Предпросмотр",
            "Развёрнутый предпросмотр будет доступен после подключения к клиенту. Сейчас область уже принимает внешнее изображение и сохраняет единую компоновку окна.",
            "maximize-2"
          );
          break;
        }
        case "open-effect-preview": openPreviewImageDialog(); break;
        case "sound-check": {
          toast("Проверка звука станет доступна после подключения аудиосистемы клиента.", "headphones");
          break;
        }
        case "stats-refresh": {
          toast("Данные не получены: клиент не подключён к игре.", "wifi-off");
          break;
        }
        case "rebind-key": {
          ui.capturedKey = true;
          rerender(true);
          toast("Нажмите новую клавишу. Esc — отмена.", "keyboard");
          break;
        }
        case "window-minimize": {
          toast("Свёртывание окна будет подключено в существующем клиенте.", "minus");
          break;
        }
        case "window-maximize": {
          toast("Размер окна определяется клиентом. Демонстрация сохраняет компактную компоновку.", "maximize");
          break;
        }
        case "window-close": {
          toast("Закрытие меню будет обрабатываться клиентом. Демонстрация остаётся открытой.", "info");
          break;
        }
        case "profile-select": {
          state.selectedProfile = actionNode.dataset.profile;
          rerender(true);
          break;
        }
        case "profile-create": {
          openDialog({
            title: "Новый профиль",
            desc: "Создание визуального профиля. Файлы и игровые данные не сохраняются.",
            icon: "folder-plus",
            input: "",
            placeholder: "Например, PvP — зелёный",
            inputLabel: "Название профиля",
            confirmLabel: "Создать",
            validate: (value) => state.profiles.some((profile) => profile.name.toLowerCase() === value.toLowerCase()) ? "Профиль с таким названием уже существует." : "",
            onConfirm: (value) => {
              const id = `profile-${Date.now()}`;
              state.profiles.push({ id, name: value, note: "Новый демонстрационный профиль", active: false });
              state.selectedProfile = id;
              rerender(false);
              toast(`Профиль «${value}» создан (демо).`, "folder-plus");
            }
          });
          break;
        }
        case "profile-save": {
          const profile = state.profiles.find((item) => item.id === state.selectedProfile);
          if (!profile) break;
          profile.note = "Демонстрационное сохранение · подключение позже";
          rerender(true);
          toast(`Настройки профиля «${profile.name}» отмечены как сохранённые (демо).`, "save");
          break;
        }
        case "profile-rename": {
          const profile = state.profiles.find((item) => item.id === state.selectedProfile);
          if (!profile) break;
          openDialog({
            title: "Переименовать профиль",
            desc: "Новое имя появится только в демонстрационном списке.",
            icon: "pencil",
            input: profile.name,
            inputLabel: "Название профиля",
            confirmLabel: "Сохранить",
            validate: (value) => state.profiles.some((item) => item.id !== profile.id && item.name.toLowerCase() === value.toLowerCase()) ? "Это имя уже занято." : "",
            onConfirm: (value) => {
              profile.name = value;
              rerender(true);
              toast("Профиль переименован (демо).", "pencil");
            }
          });
          break;
        }
        case "profile-delete": {
          const profile = state.profiles.find((item) => item.id === state.selectedProfile);
          if (!profile) break;
          if (state.profiles.length <= 1) {
            toast("Нельзя удалить единственный профиль.", "triangle-alert");
            break;
          }
          openDialog({
            title: "Удалить профиль?",
            desc: `Профиль «${profile.name}» будет удалён из демонстрационного списка. Это действие не затрагивает файлы на диске.`,
            icon: "trash-2",
            confirmLabel: "Удалить",
            danger: true,
            onConfirm: () => {
              state.profiles = state.profiles.filter((item) => item.id !== profile.id);
              state.selectedProfile = state.profiles[0]?.id || "";
              if (!state.profiles.some((item) => item.active)) state.profiles[0].active = true;
              rerender(false);
              toast("Профиль удалён (демо).", "trash-2");
            }
          });
          break;
        }
        case "profile-activate": {
          const profile = state.profiles.find((item) => item.id === state.selectedProfile);
          if (!profile) break;
          state.profiles.forEach((item) => { item.active = item.id === profile.id; });
          rerender(true);
          toast(`Активный профиль: ${profile.name} (демо).`, "user-round-check");
          break;
        }
        default:
          break;
      }
    });

    document.addEventListener("input", (event) => {
      const input = event.target;
      if (input.matches("[data-range]")) {
        handleRange(input);
        return;
      }
      if (input.matches("[data-color]")) {
        handleColor(input);
        return;
      }
      if (input.matches('[data-search="mods"]')) {
        state.modsQuery = input.value;
        filterModsInPlace();
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.matches("[data-select]")) handleSelect(event.target);
    });

    document.addEventListener("keydown", (event) => {
      if (ui.capturedKey) {
        event.preventDefault();
        if (event.key === "Escape") {
          ui.capturedKey = false;
          rerender(true);
          toast("Изменение клавиши отменено.", "x");
          return;
        }
        let name = event.key;
        if (event.code === "ShiftRight") name = "Right Shift";
        else if (event.code === "ShiftLeft") name = "Left Shift";
        else if (event.code === "ControlRight") name = "Right Ctrl";
        else if (event.code === "ControlLeft") name = "Left Ctrl";
        else if (/^Key[A-Z]$/.test(event.code)) name = event.code.slice(3);
        else if (/^Digit[0-9]$/.test(event.code)) name = event.code.slice(5);
        else if (/^F([1-9]|1[0-2])$/.test(event.code)) name = event.code;
        else if (name.length === 1) name = name.toUpperCase();
        state.controls.menuKey = name;
        ui.capturedKey = false;
        rerender(true);
        toast(`Назначена демонстрационная клавиша: ${name}. Подключение — позже.`, "keyboard");
        return;
      }
      if (event.key === "Escape" && $("#modalLayer")?.classList.contains("is-open")) {
        closeDialog();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"][data-action]')) {
        event.preventDefault();
        event.target.click();
      }
    });

    /* ───────────────────────────────────────────────────────────────────────
       ПУБЛИЧНЫЙ ИНТЕРФЕЙС ДЛЯ БУДУЩЕГО ПОДКЛЮЧЕНИЯ
       Здесь заканчивается визуальный слой. Клиент может передавать данные
       через эти функции и читать локальное состояние через getState().
    ─────────────────────────────────────────────────────────────────────── */

    window.GAYClientUI = {
      version: "1.1.5-visual-demo",
      getState: () => clone(state),
      setActiveTab(tab) {
        if (TABS.some((item) => item.id === tab)) {
          state.activeTab = tab;
          rerender(false);
        }
      },
      setActiveSection(section) {
        if (SECTIONS.some((item) => item.id === section)) {
          state.activeTab = "settings";
          state.activeSection = section;
          rerender(false);
        }
      },
      setValue(path, value) {
        setPath(state, path, value);
        rerender(true);
      },
      setPreviewImage(url) {
        state.previewImage = url || "";
        rerender(false);
      },
      clearPreviewImage() {
        state.previewImage = "";
        rerender(false);
      }
    };

    /* Первичная отрисовка. Отдельный контекст и второй экран не создаются. */
    rerender(false);
    sanitizeTextNodes();
    window.setTimeout(() => {
      sanitizeTextNodes();
      refreshIcons();
    }, 90);
  </script>

  <style>
    /* Дополнительные состояния визуального слоя */
    .preview-image {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .88;
      filter: saturate(.92) contrast(1.02);
    }
    .preview-stage:has(.preview-image)::after {
      background: linear-gradient(180deg, rgba(0,0,0,.30), transparent 26%, transparent 70%, rgba(0,0,0,.44));
    }
    .preview-stage:has(.preview-image) .stage-catbg { opacity: .04; }
    .position-tile > span {
      font-family: var(--mono);
      font-size: 6.8px;
      font-weight: 600;
      letter-spacing: -.03em;
      line-height: 1;
    }
    .switch { flex-shrink: 0; }
    .mod-card .switch { position: relative; z-index: 2; }
    .profile-card.is-selected { outline: 1px solid rgba(var(--accent-rgb), .10); outline-offset: -1px; }
    .keycap { vertical-align: middle; }
    .btn .keycap { border-color: rgba(var(--accent-rgb), .28); }
    .no-results[hidden], [hidden] { display: none !important; }
    .modal-layer { color: var(--text); }
    .dialog .btn { min-width: 78px; }
    .dialog-desc { overflow-wrap: anywhere; }
    .search-wrap input[type="search"]::-webkit-search-cancel-button {
      appearance: none;
      -webkit-appearance: none;
    }
    .top-tab { overflow: hidden; }
    .top-tab .tab-label { overflow: hidden; text-overflow: ellipsis; }
    .effect-card .group-header { border-bottom: 0; }
    .effect-card.is-open .group-header { border-bottom: 1px solid rgba(84,255,143,.08); }
    .effect-name > div { min-width: 0; }
    .effect-name .mod-desc { max-width: 210px; }
    .mod-detail-head .mod-desc { max-width: 220px; }
    .profile-card[role="button"]:focus-visible,
    .mod-card[role="button"]:focus-visible {
      outline: 2px solid rgba(var(--accent-rgb), .65);
      outline-offset: -2px;
    }
    .motion-off *, .motion-off *::before, .motion-off *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
    .quiet-glow .switch.is-on,
    .quiet-glow .preview-stage,
    .quiet-glow .preview-expand,
    .quiet-glow .brand-card,
    .quiet-glow .preview-head-icon {
      box-shadow: none !important;
    }
    .quiet-glow .preview-stage { border-color: rgba(var(--accent-rgb), .33); }
    .quiet-glow .top-tab.is-active::after,
    .quiet-glow .group-mark { box-shadow: none; }

    @keyframes shellIn {
      from { opacity: 0; transform: translateY(7px) scale(.995); }
      to { opacity: 1; transform: none; }
    }
    .menu-shell { animation: shellIn .35s cubic-bezier(.2,.8,.2,1) both; }
    .brand-card { cursor: pointer; }
    .cat-eye { transform-box: fill-box; transform-origin: center; }
    @keyframes catBlink {
      0%, 91%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(.12); }
    }
    .cat-eye { animation: catBlink 7.5s ease-in-out infinite; }
    /* Выбранный пользователем фон слегка влияет на глубину оболочки. */
    .menu-shell {
      background:
        radial-gradient(ellipse 36% 40% at 0% 12%, rgba(var(--accent-rgb), .065), transparent 72%),
        linear-gradient(142deg, color-mix(in srgb, var(--ui-bg, #041009) 82%, #0d3a1e) 0%, var(--ui-bg, #041009) 55%, color-mix(in srgb, var(--ui-bg, #041009) 76%, #000) 100%);
    }
    .module-details-footer { flex-wrap: wrap; gap: 3px; }

    /* Навигация - внутренняя секция единого окна */
    .side-nav {
      padding: 4px;
      border: 1px solid rgba(88, 255, 146, .12);
      border-radius: 13px;
      background: linear-gradient(160deg, rgba(7, 24, 14, .48), rgba(2, 10, 6, .34));
      box-shadow: inset 0 1px rgba(201, 255, 219, .025);
    }
    .side-nav { flex: 0 0 auto; overflow: hidden; }
    .nav-btn { flex: 0 0 37px; height: 37px; }
    .nav-btn.is-active::before { left: -5px; }
    .side-nav .nav-btn { gap: 9px; }
    .side-nav .nav-icon { width: 27px; height: 26px; flex-basis: 27px; }
    .side-nav .nav-label { font-size: 12.5px; }
    .nav-caption { margin: 9px 0 6px; padding: 0 7px; }
    .side-nav::after { display: none; }

    /* Декоративные рамки и орнамент окна */
    .shell-corner {
      position: absolute;
      z-index: 8;
      width: 25px;
      height: 25px;
      border: 1px solid rgba(var(--accent-rgb), .75);
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(var(--accent-rgb), .55));
    }
    .sc-tl { left: -1px; top: 7px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .sc-tr { right: -1px; top: 7px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
    .sc-bl { left: -1px; bottom: 7px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
    .sc-br { right: -1px; bottom: 7px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
    .shell-ornament {
      position: absolute;
      z-index: 7;
      left: 50%;
      width: 108px;
      height: 3px;
      transform: translateX(-50%);
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .40)) left/40px 1px no-repeat,
        linear-gradient(270deg, transparent, rgba(var(--accent-rgb), .40)) right/40px 1px no-repeat,
        radial-gradient(circle, var(--accent) 0 1.5px, transparent 2px) center/8px 8px no-repeat;
      opacity: .75;
    }
    .so-top { top: -1px; }
    .so-bottom { bottom: -1px; }

    /* Декор карточек и кнопок */
    .settings-group { transition: border-color .18s ease, box-shadow .18s ease; }
    .settings-group:hover {
      border-color: rgba(var(--accent-rgb), .24);
      box-shadow: inset 0 1px rgba(198, 255, 218, .04), 0 0 18px rgba(var(--accent-rgb), .035);
    }
    .group-header { position: relative; }
    .group-header::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      width: 14px;
      height: 4px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .22));
      pointer-events: none;
    }
    .brand-card::before {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .65), transparent);
      pointer-events: none;
    }
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(115deg, transparent 28%, rgba(221, 255, 232, .09) 50%, transparent 72%);
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .btn:hover::after { opacity: 1; }
    .preview-stage .preview-mode { letter-spacing: .12em; }
    .content-column {
      background-image:
        radial-gradient(circle at 12px 12px, rgba(var(--accent-rgb), .05) 1px, transparent 1.4px),
        linear-gradient(180deg, rgba(7, 24, 14, .62), rgba(3, 12, 7, .52));
      background-size: 24px 24px, auto;
      background-position: 0 0, 0 0;
    }
    .stage-halo {
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 48%;
      width: 62%;
      height: 56%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), .10), transparent 67%);
      filter: blur(24px);
      pointer-events: none;
    }
    .stage-corners { position: absolute; inset: 13px; bottom: 36px; z-index: 3; pointer-events: none; }
    .stage-ruler {
      position: absolute;
      z-index: 3;
      left: 18px;
      bottom: 35px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      opacity: .55;
    }
    .stage-ruler i { display: block; width: 1px; height: 5px; background: rgba(var(--accent-rgb), .28); }
    .stage-ruler i.major { height: 9px; background: rgba(var(--accent-rgb), .55); }
    .stage-meta {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 25px;
      padding: 0 13px;
      border-top: 1px solid rgba(var(--accent-rgb), .14);
      background: linear-gradient(0deg, rgba(1, 7, 3, .94), rgba(2, 12, 6, .62));
      color: #54705d;
      font-family: var(--mono);
      font-size: 6.8px;
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
    }
    .stage-meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .stage-meta b { color: #8fac97; font-weight: 500; }
    .stage-meta-right { margin-left: auto; color: rgba(var(--accent-rgb), .45) !important; }
    .stage-corners i { position: absolute; width: 17px; height: 17px; border-color: rgba(var(--accent-rgb), .42); border-style: solid; border-width: 0; }
    .stage-corners i:nth-child(1) { left: 0; top: 0; border-left-width: 1px; border-top-width: 1px; }
    .stage-corners i:nth-child(2) { right: 0; top: 0; border-right-width: 1px; border-top-width: 1px; }
    .stage-corners i:nth-child(3) { left: 0; bottom: 0; border-left-width: 1px; border-bottom-width: 1px; }
    .stage-corners i:nth-child(4) { right: 0; bottom: 0; border-right-width: 1px; border-bottom-width: 1px; }
    @media (max-width: 900px) {
      .nav-btn { height: 38px; flex-basis: 38px; }
      .nav-caption { margin: 6px 0 4px; }
    }
    @media (max-width: 620px) {
      .nav-btn { height: 34px; flex-basis: 34px; }
      .shell-corner { width: 17px; height: 17px; }
      .shell-ornament { width: 70px; }
      .top-mark { display: none; }
    }
    .preview-stage .empty-preview, .preview-stage .hud-sample, .preview-stage .graphics-status, .preview-stage .sound-preview { z-index: 4; }
    .nav-btn.is-active .nav-label { text-shadow: 0 0 12px rgba(var(--accent-rgb), .25); }
    .sidebar::before {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .35), transparent);
      pointer-events: none;
    }
    .shell-footer .sep { width: 1px; height: 9px; background: rgba(var(--accent-rgb), .20); display: inline-block; flex: 0 0 1px; }

    /* Читаемость в типичном игровом окне */
    .nav-btn { font-size: 13.5px; }
    .top-tab { font-size: 13px; }
    .section-title { font-size: 20px; }
    .section-subtitle { font-size: 11px; }
    .group-title { font-size: 13px; }
    .setting-row { min-height: 41px; }
    .row-label { font-size: 12.5px; }
    .btn { font-size: 11px; }
    .select-shell select { font-size: 11px; }
    .range-val { font-size: 10px; }
    .preview-title { font-size: 17px; }
    .preview-subtitle { font-size: 9px; }
    .tip-title { font-size: 11.5px; }
    .tip-text { font-size: 9.2px; }
    .mod-name { font-size: 11px; }
    .mod-desc { font-size: 8.4px; }
    .profile-name { font-size: 11px; }
    .hero-desc { font-size: 11.2px; }
    .hero-title { font-size: 27px; }
    .theme-name { font-size: 8px; }
    .stat-value { font-size: 17px; }
    .stat-value.dim { font-size: 11px; }
    .data-note { font-size: 9px; }
    @media (max-width: 620px) {
      .effect-name .mod-desc { max-width: 155px; }
      .range-wrap { width: 112px; }
      .preview-image { opacity: .82; }
      .top-tabs { overflow-x: auto; scrollbar-width: none; }
      .top-tabs::-webkit-scrollbar { display: none; }
      .standard { display: initial; }
    }
    @media (max-height: 680px) {
      .brand-cat { height: 130px; }
      .brand-zone { flex-basis: 148px; }
      .nav-btn { height: 34px; flex-basis: 34px; }
    }
    @media (max-width: 1110px) {
      .row-label { font-size: 11px; }
      .group-title { font-size: 12.5px; }
      .section-title { font-size: 18px; }
      .btn { font-size: 10px; }
      .preview-title { font-size: 15px; }
      .mod-name { font-size: 10.5px; }
    }
    @media (max-width: 900px) {
      .row-label { font-size: 11.5px; }
      .section-title { font-size: 19px; }
      .hero-title { font-size: 24px; }
      .theme-name { font-size: 7.5px; }
      .nav-btn { height: 37px; flex-basis: 37px; }
      .nav-btn.is-active::before { left: -4px; }
      .top-eyebrow { letter-spacing: .1em; }
    }
    @media (max-width: 620px) {
      .row-label { font-size: 10.5px; }
      .group-title { font-size: 12px; }
      .section-title { font-size: 17px; }
      .mod-name { font-size: 10px; }
      .preview-title { font-size: 15px; }
      .data-note { font-size: 8.5px; }
    }
  </style>
  <style>
    /* Маскот удалён по требованию: ни в шапке, ни в предпросмотре, ни в подсказке. */
    .brand-cat, .stage-catbg, .tip-cat { display: none !important; }
    .brand-zone { flex: 0 0 auto; height: auto; margin: 2px 0 12px; }
    .brand-card { position: relative; left: auto; right: auto; bottom: auto; margin-top: 0; display: block; width: 100%; }
    .preview-tip { padding-right: 11px; }
    @media (max-height: 800px) and (min-width: 901px) {
      .nav-btn { height: 35px; flex-basis: 35px; }
      .nav-caption { margin: 6px 0 4px; }
      .brand-zone { margin-bottom: 8px; }
      .sidebar-status { padding: 8px 10px; }
      .sidebar-status .status-meta { font-size: 9px; }
      .sidebar-mini-version { display: none; }
      .sidebar-fill { min-height: 0; flex: 1 1 auto; margin-top: 8px; padding: 8px 10px; }
      .fill-chart, .fill-pixels { display: none; }
      .fill-links { flex-direction: row; flex-wrap: wrap; margin-top: 4px; }
      .fill-link { flex: 1 1 auto; height: 24px; padding: 0 6px; font-size: 8.5px; gap: 4px; }
      .fill-divider { margin: 6px 0; }
    }
    @media (max-height: 660px) and (min-width: 901px) { .sidebar-fill { display: none; } }
    @media (max-width: 900px) { .sidebar-fill { display: none; } }
  </style>
</body>
